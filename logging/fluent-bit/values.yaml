# Fluent Bit Helm chart: 0.58.3
# Image: cr.fluentbit.io/fluent/fluent-bit:5.1.3
# Collect Kubernetes container logs and forward them to ECK Elasticsearch.

kind: DaemonSet

image:
  repository: cr.fluentbit.io/fluent/fluent-bit
  tag: "5.1.3"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true #tells the Helm chart to create the ServiceAccount.
  name: fluent-bit #gives it the name fluent-bit.

rbac:
  create: true #The chart creates the required RBAC resources.
  nodeAccess: false #The chart's node-access option is disabled

# Read the Elasticsearch password from the ECK-generated secret.
env:
  - name: ES_PASSWORD #Variable name inside Fluent Bit's container
    valueFrom: #Obtain the value from another Kubernetes resource
      secretKeyRef: #Read a specific key from a Kubernetes Secret
        name: logs-es-elastic-user #Name of the Secret
        key: elastic  #Key containing the password

# Mount the CA certificate generated by ECK.
extraVolumes:  #Adds a volume to the pod.
  - name: elasticsearch-ca
    secret:
      secretName: logs-es-http-certs-public #Identifies the Secret containing the public HTTP certificates.
      items:
        - key: ca.crt #Selects the CA certificate from the Secret.
          path: ca.crt #Names the file within the mounted volume

extraVolumeMounts:
  - name: elasticsearch-ca #References the volume created above
    mountPath: /fluent-bit/certs #Container directory where the volume is mounted
    readOnly: true #Prevents the container from writing to this mount

config:
  inputs: |
    [INPUT]
    #Fluent Bit to use the Tail input plugin, which reads log files line by line and follows new content as it is written.
        Name tail  
        Path /var/log/containers/*.log 
        multiline.parser docker, cri
        Tag kube.*
        Mem_Buf_Limit 10MB
        Skip_Long_Lines On  #Tail plugin to skip lines that exceed its supported line size instead of allowing a single oversized line to stop normal processing of that file.
        Refresh_Interval 5  #This sets the Tail plugin's file-discovery refresh interval to five seconds.

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log Off
        Keep_Log On
        Labels Off
        Annotations Off
        K8S-Logging.Parser Off
        K8S-Logging.Exclude On
        Buffer_Size 256KB

  outputs: |
    [OUTPUT]
        Name es
        Match kube.*
        Host logs-es-http.logging.svc
        Port 9200
        HTTP_User elastic
        HTTP_Passwd ${ES_PASSWORD}
        tls On 
        tls.verify On 
        tls.ca_file /fluent-bit/certs/ca.crt
        Logstash_Format On
        Logstash_Prefix kubernetes-v2
        Suppress_Type_Name On
        Retry_Limit False  #This configures unlimited retries for failed output delivery, rather than stopping after a fixed retry count.
