
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: logs
  namespace: logging
  annotations:
    eck.k8s.elastic.co/pause-orchestration: "true"
spec:
  version: 9.1.0
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
        node.roles:
          - master
          - data
          - ingest
          - remote_cluster_client
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources:
                requests:
                  cpu: 500m
                  memory: 2Gi
                limits:
                  cpu: "1"
                  memory: 2Gi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi
