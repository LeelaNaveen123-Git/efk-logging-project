
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: logging

configMapGenerator:
  - name: elasticsearch-lifecycle-config
    files:
      - ilm-policy.json
      - index-template.json
      - apply-lifecycle.sh

generatorOptions:
  disableNameSuffixHash: false

resources:
  - cronjob.yaml
