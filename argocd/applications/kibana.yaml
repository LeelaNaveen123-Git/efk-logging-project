apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kibana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/LeelaNaveen123-Git/efk-logging-project.git
    targetRevision: main
    path: logging/eck/kibana
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
