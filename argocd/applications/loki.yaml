apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: 20.2.1
      helm:
        valueFiles:
          - $values/logging/loki/values.yaml
    - repoURL: https://github.com/LeelaNaveen123-Git/efk-logging-project.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: loki
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
