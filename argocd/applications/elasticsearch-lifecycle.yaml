
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elasticsearch-lifecycle
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/LeelaNaveen123-Git/efk-logging-project.git
    targetRevision: main
    path: logging/elasticsearch-lifecycle
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
