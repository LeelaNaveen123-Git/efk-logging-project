apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-grafana-datasource
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/LeelaNaveen123-Git/efk-logging-project.git
    targetRevision: main
    path: logging/grafana-datasource
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
