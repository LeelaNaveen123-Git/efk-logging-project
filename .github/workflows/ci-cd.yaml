
name: EFK Logging Project CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: efk-logging-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART_PATH: charts/sample-app
  APP_IMAGE_NAME: efk-demo-app

jobs:
  validate-and-scan:
    name: Validate, Scan and Build
    runs-on: self-hosted

    steps:
      # 1. Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Verify tools and Python
      - name: Check required tools
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $pythonExe = "C:\Users\RamisettyLeelanaveen\AppData\Local\Python\pythoncore-3.15-64\python.exe"

          if (-not (Test-Path $pythonExe)) {
            throw "Python executable not found: $pythonExe"
          }

          & $pythonExe --version
          if ($LASTEXITCODE -ne 0) {
            throw "Python verification failed."
          }

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "PYTHON_EXE=$pythonExe" + [Environment]::NewLine,
            $utf8NoBom
          )

          foreach ($commandName in @("git", "docker", "helm", "kubectl")) {
            if (-not (Get-Command $commandName -ErrorAction SilentlyContinue)) {
              throw "Required command not found: $commandName"
            }
          }

          docker --version
          if ($LASTEXITCODE -ne 0) { throw "Docker is unavailable." }

          helm version --short
          if ($LASTEXITCODE -ne 0) { throw "Helm is unavailable." }

          kubectl version --client
          if ($LASTEXITCODE -ne 0) { throw "kubectl is unavailable." }

      # 3. Validate required GitHub secrets
      - name: Validate required secrets
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($secretName in @(
            "DOCKERHUB_USERNAME",
            "DOCKERHUB_TOKEN",
            "SONAR_HOST_URL",
            "SONAR_TOKEN"
          )) {
            $value = [Environment]::GetEnvironmentVariable($secretName)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Missing GitHub Actions secret: $secretName"
            }
          }

          $username = $env:DOCKERHUB_USERNAME.Trim()

          if ($username -cnotmatch '^[a-z0-9]+(?:[._-][a-z0-9]+)*$') {
            throw "DOCKERHUB_USERNAME must contain only your Docker Hub username."
          }

          try {
            $sonarUri = [System.Uri]$env:SONAR_HOST_URL
          }
          catch {
            throw "SONAR_HOST_URL is not a valid URL."
          }

          if ($sonarUri.Scheme -notin @("http", "https")) {
            throw "SONAR_HOST_URL must use HTTP or HTTPS."
          }

          Write-Host "Required secrets are configured."

      # 4. Install application dependencies
      - name: Install Python dependencies
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          & $env:PYTHON_EXE -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed." }

          & $env:PYTHON_EXE -m pip install -r app/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed." }

          & $env:PYTHON_EXE -m pip install pytest
          if ($LASTEXITCODE -ne 0) { throw "pytest installation failed." }

      # 5. Run tests when present
      - name: Run Python tests
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "tests") {
            & $env:PYTHON_EXE -m pytest tests -v
            if ($LASTEXITCODE -ne 0) { throw "Python tests failed." }
          }
          else {
            Write-Host "No root tests directory found; skipping pytest."
          }

      # 6. Install SonarScanner
      - name: Install SonarScanner CLI
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $version = "7.2.0.5079"
          $zipPath = Join-Path $env:RUNNER_TEMP "sonar-scanner-cli-$version.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "sonar-scanner-cli"
          $url = "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$version-windows-x64.zip"

          Invoke-WebRequest -Uri $url -OutFile $zipPath

          if (-not (Test-Path $zipPath) -or (Get-Item $zipPath).Length -lt 1MB) {
            throw "SonarScanner archive is missing or invalid."
          }

          if (Test-Path $extractPath) {
            Remove-Item $extractPath -Recurse -Force
          }

          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractPath -Force

          $scannerFolder = Get-ChildItem $extractPath -Directory | Select-Object -First 1
          if (-not $scannerFolder) { throw "SonarScanner folder not found." }

          $scanner = Join-Path $scannerFolder.FullName "bin\sonar-scanner.bat"
          if (-not (Test-Path $scanner)) { throw "SonarScanner executable not found." }

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "SONAR_SCANNER_HOME=$($scannerFolder.FullName)" + [Environment]::NewLine,
            $utf8NoBom
          )

      # 7. SonarQube analysis and quality gate
      - name: SonarQube analysis
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $scanner = Join-Path $env:SONAR_SCANNER_HOME "bin\sonar-scanner.bat"

          & $scanner `
            "-Dsonar.projectKey=efk-logging-project" `
            "-Dsonar.projectName=EFK Logging Project" `
            "-Dsonar.sources=app" `
            "-Dsonar.host.url=$env:SONAR_HOST_URL" `
            "-Dsonar.token=$env:SONAR_TOKEN" `
            "-Dsonar.qualitygate.wait=true"

          if ($LASTEXITCODE -ne 0) {
            throw "SonarQube analysis or quality gate failed."
          }

      # 8. Install Trivy
      - name: Install Trivy
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/aquasecurity/trivy/releases/latest" `
            -Headers @{ "User-Agent" = "efk-logging-ci" }

          $asset = $release.assets |
            Where-Object { $_.name -match "_Windows-64bit\.zip$" } |
            Select-Object -First 1

          if (-not $asset) { throw "Trivy Windows archive not found." }

          $zipPath = Join-Path $env:RUNNER_TEMP "trivy-windows.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "trivy-windows"

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath

          if (Test-Path $extractPath) {
            Remove-Item $extractPath -Recurse -Force
          }

          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractPath -Force

          $trivyExe = Join-Path $extractPath "trivy.exe"
          if (-not (Test-Path $trivyExe)) { throw "trivy.exe was not found." }

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText(
            $env:GITHUB_PATH,
            $extractPath + [Environment]::NewLine,
            $utf8NoBom
          )

          & $trivyExe --version
          if ($LASTEXITCODE -ne 0) { throw "Trivy verification failed." }

      # 9. Scan repository files
      - name: Trivy filesystem security scan
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          trivy fs `
            --scanners vuln,misconfig,secret `
            --severity HIGH,CRITICAL `
            --ignore-unfixed `
            --exit-code 1 `
            .

          if ($LASTEXITCODE -ne 0) {
            throw "Trivy filesystem scan failed or found HIGH/CRITICAL issues."
          }

      # 10. Validate Helm chart
      - name: Helm lint and template validation
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          helm lint $env:CHART_PATH --strict
          if ($LASTEXITCODE -ne 0) { throw "Helm lint failed." }

          helm template sample-app $env:CHART_PATH --namespace default | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Helm template rendering failed." }

      # 11. Validate image reference and build
      - name: Build Docker image
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"

          $username = $env:DOCKERHUB_USERNAME.Trim().ToLowerInvariant()
          $repository = $env:APP_IMAGE_NAME
          $tag = $env:IMAGE_TAG

          if ($username -cnotmatch '^[a-z0-9]+(?:[._-][a-z0-9]+)*$') {
            throw "Invalid Docker Hub username. Configure the username only in GitHub Secrets."
          }

          if ($repository -cnotmatch '^[a-z0-9]+(?:[._-][a-z0-9]+)*$') {
            throw "Invalid Docker repository name."
          }

          if ($tag -notmatch '^[a-f0-9]{40}$') {
            throw "IMAGE_TAG must be a full 40-character Git commit SHA."
          }

          $image = "${username}/${repository}:${tag}"

          Write-Host "Building validated Docker image reference."
          Write-Host "Repository: $repository"
          Write-Host "Tag: $tag"

          docker build --pull -f app/Dockerfile -t $image app
          if ($LASTEXITCODE -ne 0) { throw "Docker image build failed." }

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "BUILT_IMAGE=$image" + [Environment]::NewLine,
            $utf8NoBom
          )

      # 12. Scan the built image
      - name: Trivy Docker image security scan
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:BUILT_IMAGE)) {
            throw "BUILT_IMAGE is empty. Check the Docker build step."
          }

          trivy image `
            --scanners vuln,misconfig,secret `
            --severity HIGH,CRITICAL `
            --ignore-unfixed `
            --exit-code 1 `
            $env:BUILT_IMAGE

          if ($LASTEXITCODE -ne 0) {
            throw "Trivy image scan failed or found HIGH/CRITICAL issues."
          }

      # 13. Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $env:DOCKERHUB_TOKEN |
            docker login --username $env:DOCKERHUB_USERNAME --password-stdin

          if ($LASTEXITCODE -ne 0) { throw "Docker Hub login failed." }

      # 14. Push image
      - name: Push Docker image
        if: github.event_name != 'pull_request'
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          docker push $env:BUILT_IMAGE
          if ($LASTEXITCODE -ne 0) { throw "Docker image push failed." }

      # 15. Logout from Docker Hub
      - name: Logout from Docker Hub
        if: always() && github.event_name != 'pull_request'
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          docker logout
          exit 0

  deploy:
    name: Deploy to Docker Desktop Kubernetes
    needs: validate-and-scan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      # 16. Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 17. Verify Docker Desktop Kubernetes context
      - name: Verify Docker Desktop Kubernetes
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $context = kubectl config current-context
          Write-Host "Current Kubernetes context: $context"

          if ($context -ne "docker-desktop") {
            throw "Expected docker-desktop context, found: $context"
          }

          kubectl get nodes
          if ($LASTEXITCODE -ne 0) { throw "Cannot access Kubernetes nodes." }

      # 18. Deploy using Helm
      - name: Deploy sample app using Helm
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"

          $username = $env:DOCKERHUB_USERNAME.Trim().ToLowerInvariant()
          $imageRepository = "${username}/efk-demo-app"

          helm upgrade --install sample-app $env:CHART_PATH `
            --namespace default `
            --set-string "image.repository=$imageRepository" `
            --set-string "image.tag=$env:IMAGE_TAG" `
            --wait `
            --timeout 5m

          if ($LASTEXITCODE -ne 0) { throw "Helm deployment failed." }

      # 19. Verify rollout
      - name: Verify deployment
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          kubectl rollout status deployment/sample-app `
            --namespace default `
            --timeout=180s

          if ($LASTEXITCODE -ne 0) { throw "Sample app rollout failed." }

          kubectl get deployment sample-app -n default
          kubectl get pods -n default -l app.kubernetes.io/instance=sample-app
          kubectl get service sample-app -n default
