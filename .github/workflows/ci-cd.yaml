
name: EFK Logging Project CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: efk-logging-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: efk-demo-app
  HELM_CHART_PATH: charts/sample-app
  K8S_NAMESPACE: default
  K8S_DEPLOYMENT: sample-app

jobs:
  validate-and-scan:
    name: SonarQube, Trivy and Helm Validation
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($tool in @("git", "docker", "kubectl", "helm")) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "$tool is not installed or not in PATH."
            }
          }

          docker version
          kubectl version --client
          helm version

      - name: Install Trivy
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/aquasecurity/trivy/releases/latest"

          $asset = $release.assets |
            Where-Object { $_.name -match '^trivy_.*_windows-64bit\.zip$' } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Trivy Windows 64-bit package was not found."
          }

          $zipPath = Join-Path $env:RUNNER_TEMP "trivy.zip"
          $trivyDir = Join-Path $env:RUNNER_TEMP "trivy"

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
          New-Item -ItemType Directory -Path $trivyDir -Force | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $trivyDir -Force

          if (-not (Test-Path (Join-Path $trivyDir "trivy.exe"))) {
            throw "Trivy executable was not extracted."
          }

          Add-Content -Path $env:GITHUB_PATH -Value $trivyDir

      - name: Trivy filesystem scan
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          trivy fs `
            --scanners vuln,misconfig,secret `
            --severity HIGH,CRITICAL `
            --ignore-unfixed `
            --exit-code 1 `
            --skip-dirs .git `
            .

          if ($LASTEXITCODE -ne 0) {
            throw "Trivy filesystem scan failed."
          }

      - name: Helm lint
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          helm lint $env:HELM_CHART_PATH

          if ($LASTEXITCODE -ne 0) {
            throw "Helm lint failed."
          }

      - name: Helm template validation
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          helm template sample-app $env:HELM_CHART_PATH `
            --namespace $env:K8S_NAMESPACE

          if ($LASTEXITCODE -ne 0) {
            throw "Helm template validation failed."
          }

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube quality gate using PowerShell
        shell: powershell
        timeout-minutes: 6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw "SONAR_TOKEN secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:SONAR_HOST_URL)) {
            throw "SONAR_HOST_URL secret is missing."
          }

          $reportPath = Join-Path $env:GITHUB_WORKSPACE ".scannerwork/report-task.txt"

          if (-not (Test-Path $reportPath)) {
            throw "SonarQube report-task.txt was not found."
          }

          $metadata = @{}

          Get-Content $reportPath | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $metadata[$matches[1]] = $matches[2]
            }
          }

          $taskId = $metadata["ceTaskId"]

          if ([string]::IsNullOrWhiteSpace($taskId)) {
            throw "SonarQube ceTaskId was not found."
          }

          $sonarUrl = $env:SONAR_HOST_URL.TrimEnd("/")
          $credential = [Convert]::ToBase64String(
            [Text.Encoding]::UTF8.GetBytes("${env:SONAR_TOKEN}:")
          )

          $headers = @{ Authorization = "Basic $credential" }
          $deadline = (Get-Date).AddMinutes(5)
          $analysisId = $null

          do {
            $task = Invoke-RestMethod `
              -Uri "$sonarUrl/api/ce/task?id=$taskId" `
              -Headers $headers

            $status = $task.task.status
            Write-Host "SonarQube task status: $status"

            if ($status -eq "SUCCESS") {
              $analysisId = $task.task.analysisId
              break
            }

            if ($status -in @("FAILED", "CANCELED")) {
              throw "SonarQube analysis ended with status $status."
            }

            if ((Get-Date) -ge $deadline) {
              throw "Timed out waiting for SonarQube analysis."
            }

            Start-Sleep -Seconds 5
          } while ($true)

          if ([string]::IsNullOrWhiteSpace($analysisId)) {
            throw "SonarQube did not return an analysis ID."
          }

          $gate = Invoke-RestMethod `
            -Uri "$sonarUrl/api/qualitygates/project_status?analysisId=$analysisId" `
            -Headers $headers

          $gateStatus = $gate.projectStatus.status
          Write-Host "SonarQube Quality Gate: $gateStatus"

          if ($gateStatus -ne "OK") {
            throw "SonarQube quality gate failed: $gateStatus"
          }

          Write-Host "SonarQube quality gate passed."

  build-scan-push-deploy:
    name: Docker Build, ECR Push and Helm Deploy
    needs: validate-and-scan
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Trivy
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/aquasecurity/trivy/releases/latest"

          $asset = $release.assets |
            Where-Object { $_.name -match '^trivy_.*_windows-64bit\.zip$' } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Trivy Windows 64-bit package was not found."
          }

          $zipPath = Join-Path $env:RUNNER_TEMP "trivy.zip"
          $trivyDir = Join-Path $env:RUNNER_TEMP "trivy"

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
          New-Item -ItemType Directory -Path $trivyDir -Force | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $trivyDir -Force

          if (-not (Test-Path (Join-Path $trivyDir "trivy.exe"))) {
            throw "Trivy executable was not extracted."
          }

          Add-Content -Path $env:GITHUB_PATH -Value $trivyDir

      - name: Verify application build files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $requiredFiles = @(
            "app/Dockerfile",
            "app/app.py",
            "app/requirements.txt"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required build file not found: $file. Check the actual app directory structure."
            }
          }

          Write-Host "Application build files verified."

      - name: Build Docker image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $imageTag = "${{ github.sha }}"
          $localImage = "${env:ECR_REPOSITORY}:$imageTag"

          # The app directory is the Docker build context.
          # Dockerfile COPY instructions can now access app.py
          # and requirements.txt within that directory.
          docker build --pull `
            --file app/Dockerfile `
            --tag $localImage `
            app

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image build failed."
          }

      - name: Trivy container image scan
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $imageTag = "${{ github.sha }}"
          $localImage = "${env:ECR_REPOSITORY}:$imageTag"

          trivy image `
            --severity HIGH,CRITICAL `
            --ignore-unfixed `
            --exit-code 1 `
            $localImage

          if ($LASTEXITCODE -ne 0) {
            throw "Trivy image scan failed. Image will not be pushed."
          }

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          aws sts get-caller-identity

          if ($LASTEXITCODE -ne 0) {
            throw "AWS authentication failed."
          }

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $accountId = "${{ secrets.AWS_ACCOUNT_ID }}"
          $region = "${{ secrets.AWS_REGION }}"
          $imageTag = "${{ github.sha }}"
          $registry = "$accountId.dkr.ecr.$region.amazonaws.com"
          $remoteImage = "$registry/$env:ECR_REPOSITORY`:$imageTag"
          $localImage = "${env:ECR_REPOSITORY}:$imageTag"

          aws ecr describe-repositories `
            --repository-names $env:ECR_REPOSITORY `
            --region $region

          if ($LASTEXITCODE -ne 0) {
            throw "ECR repository is missing or inaccessible."
          }

          docker tag $localImage $remoteImage

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image tagging failed."
          }

          docker push $remoteImage

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image push failed."
          }

          "IMAGE_REPOSITORY=$registry/$env:ECR_REPOSITORY" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          "IMAGE_TAG=$imageTag" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify Kubernetes cluster
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          kubectl config current-context

          if ($LASTEXITCODE -ne 0) {
            throw "Kubernetes context is not configured."
          }

          kubectl get nodes

          if ($LASTEXITCODE -ne 0) {
            throw "Kubernetes cluster is not reachable."
          }

      - name: Create or update ECR image pull secret
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $region = "${{ secrets.AWS_REGION }}"
          $registry = "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$region.amazonaws.com"

          $password = aws ecr get-login-password --region $region

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($password)) {
            throw "Could not retrieve ECR credentials."
          }

          $secretYaml = kubectl create secret docker-registry ecr-registry `
            --namespace $env:K8S_NAMESPACE `
            --docker-server=$registry `
            --docker-username=AWS `
            --docker-password=$password `
            --dry-run=client -o yaml

          if ($LASTEXITCODE -ne 0) {
            throw "Could not generate Kubernetes image pull secret."
          }

          $secretYaml | kubectl apply -f -

          if ($LASTEXITCODE -ne 0) {
            throw "Could not apply Kubernetes image pull secret."
          }


      
- name: Configure ECR image pull secret
  shell: powershell
  env:
    AWS_REGION: ${{ secrets.AWS_REGION }}
    AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  run: |
    $ErrorActionPreference = "Stop"

    $registry = "$($env:AWS_ACCOUNT_ID).dkr.ecr.$($env:AWS_REGION).amazonaws.com"
    $password = aws ecr get-login-password --region $env:AWS_REGION

    if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($password)) {
      throw "Failed to retrieve ECR login password."
    }

    $manifest = kubectl create secret docker-registry ecr-registry-secret `
      --docker-server=$registry `
      --docker-username=AWS `
      --docker-password=$password `
      --namespace=default `
      --dry-run=client `
      --output=yaml

    if ($LASTEXITCODE -ne 0) {
      throw "Failed to generate secret manifest."
    }

    $manifest -join "`n" | kubectl apply -f -

    if ($LASTEXITCODE -ne 0) {
      throw "Could not configure the deployment image pull secret."
    }

      - name: Verify rollout
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          kubectl rollout status "deployment/$env:K8S_DEPLOYMENT" `
            --namespace $env:K8S_NAMESPACE `
            --timeout=5m

          if ($LASTEXITCODE -ne 0) {
            kubectl get pods --namespace $env:K8S_NAMESPACE
            throw "Application rollout failed."
          }

          kubectl get deployment $env:K8S_DEPLOYMENT `
            --namespace $env:K8S_NAMESPACE

          kubectl get pods --namespace $env:K8S_NAMESPACE
