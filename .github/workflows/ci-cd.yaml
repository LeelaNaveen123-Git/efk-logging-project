name: EFK Logging Project CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: efk-logging-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: efk-demo-app
  HELM_CHART_PATH: charts/sample-app
  K8S_NAMESPACE: default
  K8S_DEPLOYMENT: sample-app

jobs:

  # -------------------------------------------------------
  # JOB 1: SONARQUBE, TRIVY FILESYSTEM SCAN, HELM VALIDATION
  # -------------------------------------------------------

  validate-and-scan:
    name: SonarQube, Trivy and Helm Validation
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($tool in @("git", "docker", "kubectl", "helm", "aws")) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "$tool is not installed or is not in PATH."
            }
          }

          docker version
          kubectl version --client
          helm version
          aws --version
          git --version

      - name: Install Trivy
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/aquasecurity/trivy/releases/latest"

          $asset = $release.assets |
            Where-Object {
              $_.name -match '^trivy_.*_windows-64bit\.zip$'
            } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Trivy Windows 64-bit ZIP was not found."
          }

          $zipPath = Join-Path $env:RUNNER_TEMP "trivy.zip"
          $trivyDir = Join-Path $env:RUNNER_TEMP "trivy"

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile $zipPath

          New-Item -ItemType Directory -Path $trivyDir -Force |
            Out-Null

          Expand-Archive `
            -Path $zipPath `
            -DestinationPath $trivyDir `
            -Force

          $trivyExe = Join-Path $trivyDir "trivy.exe"

          if (-not (Test-Path $trivyExe)) {
            throw "Trivy executable was not found after extraction."
          }

          Add-Content -Path $env:GITHUB_PATH -Value $trivyDir

          Write-Host "Trivy installed successfully."

      - name: Trivy filesystem security scan
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          trivy fs `
            --scanners vuln,misconfig,secret `
            --severity HIGH,CRITICAL `
            --ignore-unfixed `
            --exit-code 1 `
            --skip-dirs .git `
            .

          if ($LASTEXITCODE -ne 0) {
            throw "Trivy filesystem scan failed."
          }

          Write-Host "Trivy filesystem scan passed."

      - name: Helm lint
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          helm lint $env:HELM_CHART_PATH

          if ($LASTEXITCODE -ne 0) {
            throw "Helm lint failed."
          }

          Write-Host "Helm lint passed."

      - name: Helm template validation
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          helm template sample-app $env:HELM_CHART_PATH `
            --namespace $env:K8S_NAMESPACE

          if ($LASTEXITCODE -ne 0) {
            throw "Helm template validation failed."
          }

          Write-Host "Helm template validation passed."

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube quality gate
        shell: powershell
        timeout-minutes: 6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw "SONAR_TOKEN GitHub secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:SONAR_HOST_URL)) {
            throw "SONAR_HOST_URL GitHub secret is missing."
          }

          $reportPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            ".scannerwork/report-task.txt"

          if (-not (Test-Path $reportPath)) {
            throw "SonarQube report-task.txt was not found."
          }

          $metadata = @{}

          Get-Content $reportPath | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $metadata[$matches[1]] = $matches[2]
            }
          }

          $taskId = $metadata["ceTaskId"]

          if ([string]::IsNullOrWhiteSpace($taskId)) {
            throw "SonarQube compute-engine task ID was not found."
          }

          $sonarUrl = $env:SONAR_HOST_URL.TrimEnd("/")

          $credential = [Convert]::ToBase64String(
            [Text.Encoding]::UTF8.GetBytes("${env:SONAR_TOKEN}:")
          )

          $headers = @{
            Authorization = "Basic $credential"
          }

          $deadline = (Get-Date).AddMinutes(5)
          $analysisId = $null

          do {
            $task = Invoke-RestMethod `
              -Uri "$sonarUrl/api/ce/task?id=$taskId" `
              -Headers $headers

            $status = $task.task.status

            Write-Host "SonarQube task status: $status"

            if ($status -eq "SUCCESS") {
              $analysisId = $task.task.analysisId
              break
            }

            if ($status -in @("FAILED", "CANCELED")) {
              throw "SonarQube analysis ended with status $status."
            }

            if ((Get-Date) -ge $deadline) {
              throw "Timed out waiting for SonarQube analysis."
            }

            Start-Sleep -Seconds 5
          } while ($true)

          if ([string]::IsNullOrWhiteSpace($analysisId)) {
            throw "SonarQube did not return an analysis ID."
          }

          $gate = Invoke-RestMethod `
            -Uri "$sonarUrl/api/qualitygates/project_status?analysisId=$analysisId" `
            -Headers $headers

          $gateStatus = $gate.projectStatus.status

          Write-Host "SonarQube Quality Gate: $gateStatus"

          if ($gateStatus -ne "OK") {
            throw "SonarQube quality gate failed: $gateStatus"
          }

          Write-Host "SonarQube quality gate passed."

  # -------------------------------------------------------
  # JOB 2: BUILD, SECURITY SCAN, PUSH TO ECR, GITOPS UPDATE
  # -------------------------------------------------------

  build-scan-push:
    name: Docker Build, Trivy Scan, ECR Push and GitOps Update
    needs: validate-and-scan
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify application build files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $requiredFiles = @(
            "app/Dockerfile",
            "app/app.py",
            "app/requirements.txt",
            "charts/sample-app/Chart.yaml",
            "charts/sample-app/values.yaml"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required file not found: $file"
            }
          }

          Write-Host "Application and Helm chart files verified."

      - name: Install Trivy
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/aquasecurity/trivy/releases/latest"

          $asset = $release.assets |
            Where-Object {
              $_.name -match '^trivy_.*_windows-64bit\.zip$'
            } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Trivy Windows 64-bit ZIP was not found."
          }

          $zipPath = Join-Path $env:RUNNER_TEMP "trivy.zip"
          $trivyDir = Join-Path $env:RUNNER_TEMP "trivy"

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile $zipPath

          New-Item -ItemType Directory -Path $trivyDir -Force |
            Out-Null

          Expand-Archive `
            -Path $zipPath `
            -DestinationPath $trivyDir `
            -Force

          if (-not (Test-Path (Join-Path $trivyDir "trivy.exe"))) {
            throw "Trivy executable was not found after extraction."
          }

          Add-Content -Path $env:GITHUB_PATH -Value $trivyDir

          Write-Host "Trivy installed successfully."

      - name: Build Docker image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $imageTag = "${{ github.sha }}"
          $localImage = "${env:ECR_REPOSITORY}:$imageTag"

          docker build --pull `
            --file app/Dockerfile `
            --tag $localImage `
            app

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image build failed."
          }

          Write-Host "Docker image built: $localImage"

      - name: Trivy container image security scan
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $imageTag = "${{ github.sha }}"
          $localImage = "${env:ECR_REPOSITORY}:$imageTag"

          trivy image `
            --severity HIGH,CRITICAL `
            --ignore-unfixed `
            --exit-code 1 `
            $localImage

          if ($LASTEXITCODE -ne 0) {
            throw "Trivy image scan failed. Image will not be pushed."
          }

          Write-Host "Trivy container image scan passed."

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity and account
        shell: powershell
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = "Stop"

          $identityJson = aws sts get-caller-identity --output json

          if ($LASTEXITCODE -ne 0) {
            throw "AWS authentication failed."
          }

          $identity = $identityJson | ConvertFrom-Json

          Write-Host "Authenticated AWS account: $($identity.Account)"
          Write-Host "Authenticated AWS ARN: $($identity.Arn)"

          if ($identity.Account -ne $env:EXPECTED_AWS_ACCOUNT_ID) {
            throw "Authenticated AWS account does not match AWS_ACCOUNT_ID."
          }

      - name: Verify ECR repository
        shell: powershell
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = "Stop"

          aws ecr describe-repositories `
            --registry-id $env:EXPECTED_AWS_ACCOUNT_ID `
            --repository-names $env:ECR_REPOSITORY `
            --region $env:AWS_REGION

          if ($LASTEXITCODE -ne 0) {
            throw "ECR repository is missing or inaccessible."
          }

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push Docker image to ECR
        shell: powershell
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = "Stop"

          $imageTag = "${{ github.sha }}"

          $localImage = "{0}:{1}" -f `
            $env:ECR_REPOSITORY, $imageTag

          $remoteImage = "{0}.dkr.ecr.{1}.amazonaws.com/{2}:{3}" -f `
            $env:AWS_ACCOUNT_ID, `
            $env:AWS_REGION, `
            $env:ECR_REPOSITORY, `
            $imageTag

          docker tag $localImage $remoteImage

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image tagging failed."
          }

          docker push $remoteImage

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image push to ECR failed."
          }

          Write-Host "Successfully pushed: $remoteImage"

          "IMAGE_REPOSITORY=$($env:AWS_ACCOUNT_ID).dkr.ecr.$($env:AWS_REGION).amazonaws.com/$env:ECR_REPOSITORY" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "IMAGE_TAG=$imageTag" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ---------------------------------------------------
      # GITOPS: UPDATE THE HELM IMAGE TAG FOR ARGO CD
      # ---------------------------------------------------

      - name: Update Helm values for Argo CD
        if: success()
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $valuesFile = "charts/sample-app/values.yaml"
          $imageTag = "${{ github.sha }}"

          if (-not (Test-Path $valuesFile)) {
            throw "Helm values file not found: $valuesFile"
          }

          $content = Get-Content -Path $valuesFile -Raw

          # Update the tag inside the top-level image block.
          $pattern = '(?ms)(^image:\s*\r?\n(?:(?!^\S).*\r?\n)*?^[ \t]+tag:\s*)[^\r\n]+'

          $matchesFound = [regex]::Matches($content, $pattern)

          if ($matchesFound.Count -ne 1) {
            throw "Expected exactly one image.tag under the top-level image block in $valuesFile. No automatic change was made."
          }

          $updatedContent = [regex]::Replace(
            $content,
            $pattern,
            [System.Text.RegularExpressions.MatchEvaluator]{
              param($match)
              return $match.Groups[1].Value + '"' + $imageTag + '"'
            },
            1
          )

          if ($updatedContent -eq $content) {
            throw "Could not update the image tag in $valuesFile."
          }

          Set-Content `
            -Path $valuesFile `
            -Value $updatedContent `
            -Encoding utf8 `
            -NoNewline

          Write-Host "Updated Helm image tag to $imageTag"

      - name: Commit and push GitOps image tag
        shell: powershell
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add charts/sample-app/values.yaml

          git diff --cached --check

          if ($LASTEXITCODE -ne 0) {
            throw "Git diff validation failed."
          }

          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {
            Write-Host "No Helm values changes detected."
            exit 0
          }

          git commit -m "chore(gitops): deploy image $env:IMAGE_TAG"

          if ($LASTEXITCODE -ne 0) {
            throw "GitOps commit failed."
          }

          git push origin "HEAD:main"

          if ($LASTEXITCODE -ne 0) {
            throw "Could not push the GitOps image tag update."
          }

          Write-Host "GitOps image tag update pushed successfully."