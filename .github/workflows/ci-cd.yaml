
name: CI-CD - SonarQube, Trivy and Helm

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/efk-demo-app
  CHART_PATH: charts/sample-app

jobs:
  validate-and-scan:
    name: Code Quality and Security
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required tools
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          python --version
          if ($LASTEXITCODE -ne 0) { throw "Python is not available." }

          docker --version
          if ($LASTEXITCODE -ne 0) { throw "Docker is not available." }

          helm version
          if ($LASTEXITCODE -ne 0) { throw "Helm is not available." }

          git --version
          if ($LASTEXITCODE -ne 0) { throw "Git is not available." }

      - name: Validate required secrets
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace("${{ secrets.DOCKERHUB_USERNAME }}")) {
            throw "Missing GitHub secret: DOCKERHUB_USERNAME"
          }

          if ([string]::IsNullOrWhiteSpace("${{ secrets.DOCKERHUB_TOKEN }}")) {
            throw "Missing GitHub secret: DOCKERHUB_TOKEN"
          }

          if ([string]::IsNullOrWhiteSpace("${{ secrets.SONAR_HOST_URL }}")) {
            throw "Missing GitHub secret: SONAR_HOST_URL"
          }

          if ([string]::IsNullOrWhiteSpace("${{ secrets.SONAR_TOKEN }}")) {
            throw "Missing GitHub secret: SONAR_TOKEN"
          }

      - name: Install Python dependencies
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "Failed to upgrade pip." }

          python -m pip install -r app/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Failed to install application dependencies." }

          python -m pip install pytest
          if ($LASTEXITCODE -ne 0) { throw "Failed to install pytest." }

      - name: Run tests if present
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "tests") {
            python -m pytest tests
            if ($LASTEXITCODE -ne 0) {
              throw "Python tests failed."
            }
          } else {
            Write-Host "No root tests directory found; skipping tests."
          }

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.34.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Helm lint
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          helm lint $env:CHART_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "Helm lint failed."
          }

      - name: Build Docker image
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $image = "$($env:IMAGE_NAME):$($env:GITHUB_SHA)"
          Write-Host "Building image: $image"

          docker build -f app/Dockerfile -t $image app
          if ($LASTEXITCODE -ne 0) {
            throw "Docker image build failed."
          }

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.34.0
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/efk-demo-app:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push scanned image
        if: github.event_name != 'pull_request'
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $image = "$($env:IMAGE_NAME):$($env:GITHUB_SHA)"
          docker push $image
          if ($LASTEXITCODE -ne 0) {
            throw "Docker image push failed."
          }

  deploy:
    name: Deploy application with Helm
    needs: validate-and-scan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kubernetes context
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          kubectl config current-context
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot read the Kubernetes context."
          }

          kubectl get nodes
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot access the Kubernetes cluster."
          }

      - name: Deploy application with Helm
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          helm upgrade --install sample-app $env:CHART_PATH `
            --namespace default `
            --set image.repository="$env:IMAGE_NAME" `
            --set-string image.tag="$env:GITHUB_SHA" `
            --wait `
            --timeout 5m

          if ($LASTEXITCODE -ne 0) {
            throw "Helm deployment failed."
          }

      - name: Verify deployment
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          kubectl rollout status deployment/sample-app `
            --namespace default `
            --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "Sample application rollout failed."
          }

          kubectl get pods -n default
          kubectl get service sample-app -n default
