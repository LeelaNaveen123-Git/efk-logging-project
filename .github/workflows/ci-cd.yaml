
name: EFK Logging Project CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: efk-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-cd:
    name: SonarQube, Trivy, Docker and Helm
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60

    env:
      IMAGE_NAME: efk-demo-app
      CHART_PATH: charts/sample-app
      TRIVY_VERSION: "0.58.2"

    steps:
      # ----------------------------------------------------
      # 1. CHECK OUT SOURCE CODE
      # ----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        continue-on-error: true

      # ----------------------------------------------------
      # 2. SET UP PYTHON
      # ----------------------------------------------------
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
        continue-on-error: true

      # ----------------------------------------------------
      # 3. CHECK TOOLS AND SECRETS
      # ----------------------------------------------------
      - name: Validate required tools and secrets
        id: validate
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $problems = @()

          Write-Host "Checking required tools..."

          foreach ($tool in @("git", "docker", "helm")) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              $problems += "Required tool not found: $tool"
            } else {
              Write-Host "$tool is installed."
            }
          }

          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_USERNAME)) {
            $problems += "GitHub secret DOCKERHUB_USERNAME is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_TOKEN)) {
            $problems += "GitHub secret DOCKERHUB_TOKEN is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            $problems += "GitHub secret SONAR_TOKEN is missing."
          }

          if ($problems.Count -gt 0) {
            $problems | ForEach-Object { Write-Host "::error::$_" }
            throw "Validation failed. Review the errors above."
          }

          Write-Host "Required tools and secrets are present."

      # ----------------------------------------------------
      # 4. INSTALL/CACHE TRIVY
      # ----------------------------------------------------
      - name: Install Trivy if missing
        id: install-trivy
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $toolDirectory = Join-Path $env:USERPROFILE ".tools\trivy"
          $trivyExe = Join-Path $toolDirectory "trivy.exe"
          $zipPath = Join-Path $env:TEMP "trivy-$env:TRIVY_VERSION.zip"

          New-Item -ItemType Directory -Path $toolDirectory -Force |
            Out-Null

          $installRequired = $true

          if (Test-Path $trivyExe) {
            $versionOutput = & $trivyExe --version 2>&1 |
              Out-String

            if ($versionOutput -match [regex]::Escape($env:TRIVY_VERSION)) {
              $installRequired = $false
              Write-Host "Trivy $env:TRIVY_VERSION is already installed."
            }
          }

          if ($installRequired) {
            $downloadUrl = "https://github.com/aquasecurity/trivy/releases/download/v$env:TRIVY_VERSION/trivy_$($env:TRIVY_VERSION)_Windows-64bit.zip"

            Write-Host "Downloading Trivy..."
            Invoke-WebRequest `
              -Uri $downloadUrl `
              -OutFile $zipPath

            Expand-Archive `
              -Path $zipPath `
              -DestinationPath $toolDirectory `
              -Force

            Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path $trivyExe)) {
            throw "Trivy executable was not found at $trivyExe"
          }

          & $trivyExe --version

      # ----------------------------------------------------
      # 5. SONARQUBE ANALYSIS
      # ----------------------------------------------------
      - name: SonarQube code analysis
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'http://localhost:9000' }}
        with:
          args: >
            -Dsonar.projectKey=efk-logging-project
            -Dsonar.sources=app
            -Dsonar.python.version=3.12
        continue-on-error: true

      # ----------------------------------------------------
      # 6. TRIVY FILESYSTEM SCAN
      # ----------------------------------------------------
      - name: Trivy filesystem vulnerability scan
        id: trivy-fs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $trivyExe = Join-Path $env:USERPROFILE ".tools\trivy\trivy.exe"

          if (-not (Test-Path $trivyExe)) {
            throw "Trivy is not installed."
          }

          & $trivyExe fs `
            --scanners vuln,secret,misconfig `
            --severity HIGH,CRITICAL `
            --ignore-unfixed `
            --exit-code 1 `
            --no-progress `
            .

          if ($LASTEXITCODE -ne 0) {
            throw "Trivy filesystem scan reported findings or failed."
          }
        continue-on-error: true

      # ----------------------------------------------------
      # 7. INSTALL PYTHON DEPENDENCIES
      # ----------------------------------------------------
      - name: Install application dependencies
        id: install-dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "app/requirements.txt")) {
            Write-Host "No app/requirements.txt found; skipping pip installation."
            exit 0
          }

          python -m pip install --upgrade pip

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upgrade pip."
          }

          python -m pip install -r app/requirements.txt

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install application dependencies."
          }
        continue-on-error: true

      # ----------------------------------------------------
      # 8. HELM CHART VALIDATION
      # ----------------------------------------------------
      - name: Helm lint
        id: helm-lint
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "$env:CHART_PATH/Chart.yaml")) {
            throw "Helm chart not found at $env:CHART_PATH"
          }

          helm lint $env:CHART_PATH

          if ($LASTEXITCODE -ne 0) {
            throw "Helm lint failed."
          }

      - name: Validate rendered Helm manifests
        id: helm-template
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          helm template sample-app $env:CHART_PATH `
            --namespace default `
            --debug

          if ($LASTEXITCODE -ne 0) {
            throw "Helm template validation failed."
          }

      # ----------------------------------------------------
      # 9. BUILD DOCKER IMAGE
      # ----------------------------------------------------
      - name: Build Docker image
        id: docker-build
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_USERNAME)) {
            throw "DOCKERHUB_USERNAME is missing."
          }

          $username = $env:DOCKERHUB_USERNAME.Trim().ToLowerInvariant()
          $image = "${username}/$env:IMAGE_NAME`:$env:GITHUB_SHA"

          Write-Host "Building image: $image"

          docker build `
            --file app/Dockerfile `
            --tag $image `
            app

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image build failed."
          }

          Write-Host "Docker image built successfully."

      # ----------------------------------------------------
      # 10. LOGIN TO DOCKER HUB AND PUSH
      # ----------------------------------------------------
      - name: Push Docker image to Docker Hub
        id: docker-push
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $username = $env:DOCKERHUB_USERNAME.Trim().ToLowerInvariant()
          $image = "${username}/$env:IMAGE_NAME`:$env:GITHUB_SHA"

          $env:DOCKERHUB_TOKEN |
            docker login `
              --username $username `
              --password-stdin

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Hub login failed. Check the token and its write permissions."
          }

          docker push $image

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image push failed."
          }

          Write-Host "Successfully pushed $image"

      # ----------------------------------------------------
      # 11. TRIVY DOCKER IMAGE SCAN
      # ----------------------------------------------------
      - name: Trivy Docker image scan
        id: trivy-image
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $ErrorActionPreference = "Stop"

          $trivyExe = Join-Path $env:USERPROFILE ".tools\trivy\trivy.exe"
          $username = $env:DOCKERHUB_USERNAME.Trim().ToLowerInvariant()
          $image = "${username}/$env:IMAGE_NAME`:$env:GITHUB_SHA"

          if (-not (Test-Path $trivyExe)) {
            throw "Trivy is not installed."
          }

          & $trivyExe image `
            --scanners vuln,secret `
            --severity HIGH,CRITICAL `
            --ignore-unfixed `
            --exit-code 1 `
            --no-progress `
            $image

          if ($LASTEXITCODE -ne 0) {
            throw "Trivy image scan reported findings or failed."
          }
        continue-on-error: true

      # ----------------------------------------------------
      # 12. LOG OUT OF DOCKER HUB
      # ----------------------------------------------------
      - name: Docker Hub logout
        if: always()
        shell: powershell
        run: |
          docker logout 2>$null
          Write-Host "Docker Hub logout step completed."

      # ----------------------------------------------------
      # 13. FINAL PIPELINE STATUS
      # ----------------------------------------------------
      - name: Report pipeline results
        id: final-status
        if: always()
        shell: powershell
        env:
          VALIDATE_RESULT: ${{ steps.validate.outcome }}
          TRIVY_INSTALL_RESULT: ${{ steps.install-trivy.outcome }}
          SONAR_RESULT: ${{ steps.sonar.outcome }}
          TRIVY_FS_RESULT: ${{ steps.trivy-fs.outcome }}
          DEPENDENCIES_RESULT: ${{ steps.install-dependencies.outcome }}
          HELM_LINT_RESULT: ${{ steps.helm-lint.outcome }}
          HELM_TEMPLATE_RESULT: ${{ steps.helm-template.outcome }}
          DOCKER_BUILD_RESULT: ${{ steps.docker-build.outcome }}
          DOCKER_PUSH_RESULT: ${{ steps.docker-push.outcome }}
          TRIVY_IMAGE_RESULT: ${{ steps.trivy-image.outcome }}
        run: |
          $ErrorActionPreference = "Continue"

          $results = [ordered]@{
            "Required tools and secrets" = $env:VALIDATE_RESULT
            "Trivy installation"          = $env:TRIVY_INSTALL_RESULT
            "SonarQube analysis"          = $env:SONAR_RESULT
            "Trivy filesystem scan"       = $env:TRIVY_FS_RESULT
            "Python dependencies"         = $env:DEPENDENCIES_RESULT
            "Helm lint"                   = $env:HELM_LINT_RESULT
            "Helm template validation"    = $env:HELM_TEMPLATE_RESULT
            "Docker build"                = $env:DOCKER_BUILD_RESULT
            "Docker Hub push"              = $env:DOCKER_PUSH_RESULT
            "Trivy image scan"             = $env:TRIVY_IMAGE_RESULT
          }

          Write-Host ""
          Write-Host "========== PIPELINE RESULTS =========="

          $failures = @()

          foreach ($entry in $results.GetEnumerator()) {
            Write-Host ("{0}: {1}" -f $entry.Key, $entry.Value)

            if ($entry.Value -ne "success" -and
                $entry.Value -ne "skipped") {
              $failures += $entry.Key
            }
          }

          Write-Host "======================================"

          if ($failures.Count -gt 0) {
            Write-Host "::error::Pipeline completed with failed steps: $($failures -join ', ')"
            exit 1
          }

          Write-Host "All pipeline steps completed successfully."
