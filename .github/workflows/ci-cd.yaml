name: EFK Logging Project CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: efk-logging-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: efk-demo-app
  HELM_CHART_PATH: charts/sample-app
  K8S_NAMESPACE: default
  K8S_DEPLOYMENT: sample-app

jobs:
  validate-and-scan:
    name: Validate, SonarQube, Trivy, Helm
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check required tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($tool in @("git", "docker", "kubectl", "helm")) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "$tool is not installed or is not available in PATH."
            }
          }

          docker version
          kubectl version --client
          helm version

      - name: Install Trivy
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/aquasecurity/trivy/releases/latest"

          $asset = $release.assets |
            Where-Object { $_.name -match '^trivy_.*_windows-64bit\.zip$' } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Could not find the Trivy Windows 64-bit release."
          }

          $zipPath = Join-Path $env:RUNNER_TEMP "trivy.zip"
          $trivyDir = Join-Path $env:RUNNER_TEMP "trivy"

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
          New-Item -ItemType Directory -Path $trivyDir -Force | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $trivyDir -Force

          if (-not (Test-Path (Join-Path $trivyDir "trivy.exe"))) {
            throw "Trivy executable was not found after extraction."
          }

          Add-Content -Path $env:GITHUB_PATH -Value $trivyDir

      - name: Trivy filesystem security scan
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          trivy fs `
            --scanners vuln,misconfig,secret `
            --severity HIGH,CRITICAL `
            --ignore-unfixed `
            --exit-code 1 `
            .

          if ($LASTEXITCODE -ne 0) {
            throw "Trivy filesystem scan failed. Review the reported findings."
          }

      - name: Helm lint
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          helm lint $env:HELM_CHART_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "Helm lint failed."
          }

      - name: Helm template validation
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          helm template sample-app $env:HELM_CHART_PATH `
            --namespace $env:K8S_NAMESPACE `
            --debug

          if ($LASTEXITCODE -ne 0) {
            throw "Helm template validation failed."
          }

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Check SonarQube quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build-scan-push-deploy:
    name: Docker Build, ECR Push, Helm Deploy
    needs: validate-and-scan
    # Do not push images or deploy from pull requests.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Trivy
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/aquasecurity/trivy/releases/latest"

          $asset = $release.assets |
            Where-Object { $_.name -match '^trivy_.*_windows-64bit\.zip$' } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Could not find the Trivy Windows 64-bit release."
          }

          $zipPath = Join-Path $env:RUNNER_TEMP "trivy.zip"
          $trivyDir = Join-Path $env:RUNNER_TEMP "trivy"

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
          New-Item -ItemType Directory -Path $trivyDir -Force | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $trivyDir -Force

          if (-not (Test-Path (Join-Path $trivyDir "trivy.exe"))) {
            throw "Trivy executable was not found after extraction."
          }

          Add-Content -Path $env:GITHUB_PATH -Value $trivyDir

      - name: Build Docker image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $imageTag = "${{ github.sha }}"

          docker build --pull `
            --file app/Dockerfile `
            --tag "$env:ECR_REPOSITORY`:$imageTag" `
            .

          if ($LASTEXITCODE -ne 0) {
            throw "Docker build failed."
          }

      - name: Trivy Docker image scan
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $imageTag = "${{ github.sha }}"
          $image = "$env:ECR_REPOSITORY`:$imageTag"

          trivy image `
            --severity HIGH,CRITICAL `
            --ignore-unfixed `
            --exit-code 1 `
            $image

          if ($LASTEXITCODE -ne 0) {
            throw "Trivy image scan failed. Image will not be pushed."
          }

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          aws sts get-caller-identity
          if ($LASTEXITCODE -ne 0) {
            throw "AWS authentication failed."
          }

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push Docker image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $accountId = "${{ secrets.AWS_ACCOUNT_ID }}"
          $region = "${{ secrets.AWS_REGION }}"
          $imageTag = "${{ github.sha }}"
          $registry = "$accountId.dkr.ecr.$region.amazonaws.com"
          $repository = "$registry/$env:ECR_REPOSITORY"

          aws ecr describe-repositories `
            --repository-names $env:ECR_REPOSITORY `
            --region $region

          if ($LASTEXITCODE -ne 0) {
            throw "ECR repository '$env:ECR_REPOSITORY' does not exist or cannot be accessed."
          }

          docker tag "$env:ECR_REPOSITORY`:$imageTag" "$repository`:$imageTag"
          if ($LASTEXITCODE -ne 0) {
            throw "Docker image tagging failed."
          }

          docker push "$repository`:$imageTag"
          if ($LASTEXITCODE -ne 0) {
            throw "Docker image push failed."
          }

          "IMAGE_REPOSITORY=$repository" | Out-File -FilePath $env:GITHUB_ENV -Append
          "IMAGE_TAG=$imageTag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify Kubernetes context
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          kubectl config current-context
          if ($LASTEXITCODE -ne 0) {
            throw "No usable Kubernetes context is configured for the runner."
          }

          kubectl get nodes
          if ($LASTEXITCODE -ne 0) {
            throw "Kubernetes cluster is not reachable."
          }

      - name: Configure ECR image pull secret
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $region = "${{ secrets.AWS_REGION }}"
          $registry = "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$region.amazonaws.com"

          $password = aws ecr get-login-password --region $region
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($password)) {
            throw "Could not retrieve the ECR login password."
          }

          kubectl create secret docker-registry ecr-registry `
            --namespace $env:K8S_NAMESPACE `
            --docker-server=$registry `
            --docker-username=AWS `
            --docker-password=$password `
            --dry-run=client -o yaml |
            kubectl apply -f -

          if ($LASTEXITCODE -ne 0) {
            throw "Could not create or update the ECR image pull secret."
          }

      - name: Deploy with Helm
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          helm upgrade --install sample-app $env:HELM_CHART_PATH `
            --namespace $env:K8S_NAMESPACE `
            --create-namespace `
            --set-string image.repository="$env:IMAGE_REPOSITORY" `
            --set-string image.tag="$env:IMAGE_TAG" `
            --wait `
            --timeout 5m

          if ($LASTEXITCODE -ne 0) {
            throw "Helm deployment failed."
          }

      - name: Configure ECR pull secret on deployment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          kubectl patch deployment $env:K8S_DEPLOYMENT `
            --namespace $env:K8S_NAMESPACE `
            --type=strategic `
            --patch '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"ecr-registry"}]}}}}'

          if ($LASTEXITCODE -ne 0) {
            throw "Could not configure the ECR image pull secret on the deployment."
          }

      - name: Verify rollout
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          kubectl rollout status "deployment/$env:K8S_DEPLOYMENT" `
            --namespace $env:K8S_NAMESPACE `
            --timeout=5m

          if ($LASTEXITCODE -ne 0) {
            kubectl get pods --namespace $env:K8S_NAMESPACE
            throw "Deployment rollout did not complete successfully."
          }

          kubectl get deployment $env:K8S_DEPLOYMENT `
            --namespace $env:K8S_NAMESPACE

          kubectl get pods --namespace $env:K8S_NAMESPACE