
name: EFK Logging Project CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: efk-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-cd:
    name: EFK CI/CD Pipeline
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60

    env:
      IMAGE_NAME: efk-demo-app
      CHART_PATH: charts/sample-app

    steps:
      # 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Use Python already installed on the runner
      - name: Check installed Python
        id: python
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $pythonExe = Get-Command python -ErrorAction Stop
          Write-Host "Python executable: $($pythonExe.Source)"

          python --version
          if ($LASTEXITCODE -ne 0) {
            throw "Python is not available."
          }

          python -c "import sys; print('Python executable:', sys.executable); print('Python version:', sys.version)"
          if ($LASTEXITCODE -ne 0) {
            throw "Python verification failed."
          }

      # 3. Validate tools, secrets and Docker daemon
      - name: Validate tools and secrets
        id: validate
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($tool in @("git", "docker", "helm", "python")) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Required tool not found: $tool"
            }
            Write-Host "$tool is installed."
          }

          foreach ($secretName in @(
            "DOCKERHUB_USERNAME",
            "DOCKERHUB_TOKEN",
            "SONAR_TOKEN"
          )) {
            if ([string]::IsNullOrWhiteSpace(
              [Environment]::GetEnvironmentVariable($secretName)
            )) {
              throw "Required GitHub secret is missing: $secretName"
            }
          }

          docker version
          if ($LASTEXITCODE -ne 0) {
            throw "Docker daemon is unavailable."
          }

      # 4. Install or reuse Trivy
      - name: Install Trivy
        id: install-trivy
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $toolDirectory = Join-Path $env:USERPROFILE ".tools\trivy"
          $trivyExe = Join-Path $toolDirectory "trivy.exe"

          New-Item -ItemType Directory -Path $toolDirectory -Force |
            Out-Null

          if (Test-Path $trivyExe) {
            & $trivyExe --version
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Using cached Trivy."
              exit 0
            }

            Remove-Item $trivyExe -Force -ErrorAction SilentlyContinue
          }

          $releasePage = "https://github.com/aquasecurity/trivy/releases/latest"
          $response = Invoke-WebRequest `
            -Uri $releasePage `
            -MaximumRedirection 10 `
            -UseBasicParsing

          $finalUrl = $response.BaseResponse.ResponseUri.AbsoluteUri

          if ($finalUrl -notmatch '/releases/tag/(v[0-9.]+)$') {
            throw "Unable to determine Trivy release version: $finalUrl"
          }

          $version = $Matches[1].TrimStart("v")
          $assetName = "trivy_${version}_windows-64bit.zip"
          $downloadUrl = "https://github.com/aquasecurity/trivy/releases/download/v$version/$assetName"

          $zipPath = Join-Path $env:TEMP $assetName
          $extractPath = Join-Path $env:TEMP "trivy-extract"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $zipPath -UseBasicParsing

          if (Test-Path $extractPath) {
            Remove-Item $extractPath -Recurse -Force
          }

          New-Item -ItemType Directory -Path $extractPath -Force |
            Out-Null

          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

          $downloadedExe = Get-ChildItem $extractPath -Filter "trivy.exe" -Recurse |
            Select-Object -First 1

          if (-not $downloadedExe) {
            throw "Downloaded archive does not contain trivy.exe."
          }

          Copy-Item $downloadedExe.FullName $trivyExe -Force

          Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
          Remove-Item $extractPath -Recurse -Force -ErrorAction SilentlyContinue

          & $trivyExe --version
          if ($LASTEXITCODE -ne 0) {
            throw "Trivy installation verification failed."
          }

      # 5. SonarQube static code analysis
      - name: SonarQube code analysis
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'http://localhost:9000' }}
        with:
          args: >
            -Dsonar.projectKey=efk-logging-project
            -Dsonar.sources=app
            -Dsonar.python.version=3.12
        continue-on-error: true

      # 6. Install application dependencies
      - name: Install Python dependencies
        id: dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "app/requirements.txt")) {
            throw "app/requirements.txt was not found."
          }

          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {
            throw "pip upgrade failed."
          }

          python -m pip install -r app/requirements.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Dependency installation failed."
          }
        continue-on-error: true

      # 7. Scan source files and configuration
      - name: Trivy filesystem scan
        id: trivy-fs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $trivyExe = Join-Path $env:USERPROFILE ".tools\trivy\trivy.exe"

          if (-not (Test-Path $trivyExe)) {
            throw "Trivy executable not found."
          }

          & $trivyExe fs `
            --scanners vuln,secret,misconfig `
            --severity HIGH,CRITICAL `
            --ignore-unfixed `
            --exit-code 1 `
            --no-progress `
            .

          if ($LASTEXITCODE -ne 0) {
            throw "Filesystem scan failed or reported HIGH/CRITICAL findings."
          }
        continue-on-error: true

      # 8. Validate Helm chart
      - name: Helm chart lint
        id: helm-lint
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "$env:CHART_PATH/Chart.yaml")) {
            throw "Helm chart not found: $env:CHART_PATH"
          }

          helm lint $env:CHART_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "Helm lint failed."
          }
        continue-on-error: true

      # 9. Render Kubernetes manifests
      - name: Helm template validation
        id: helm-template
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          helm template sample-app $env:CHART_PATH `
            --namespace default

          if ($LASTEXITCODE -ne 0) {
            throw "Helm template validation failed."
          }
        continue-on-error: true

      # 10. Build image with a unique commit SHA tag
      - name: Build Docker image
        id: docker-build
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_USERNAME)) {
            throw "DOCKERHUB_USERNAME is missing."
          }

          if (-not (Test-Path "app/Dockerfile")) {
            throw "app/Dockerfile was not found."
          }

          $username = $env:DOCKERHUB_USERNAME.Trim().ToLowerInvariant()
          $image = "docker.io/${username}/$($env:IMAGE_NAME):$env:GITHUB_SHA"

          Write-Host "Building image: $image"

          docker build `
            --file app/Dockerfile `
            --tag $image `
            app

          if ($LASTEXITCODE -ne 0) {
            throw "Docker build failed."
          }

          docker image inspect $image | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Built image is missing."
          }
        continue-on-error: true

      # 11. Scan local image before publishing
      - name: Trivy image scan
        id: trivy-image
        if: always() && steps.docker-build.outcome == 'success' && steps.install-trivy.outcome == 'success'
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $ErrorActionPreference = "Stop"

          $trivyExe = Join-Path $env:USERPROFILE ".tools\trivy\trivy.exe"
          $username = $env:DOCKERHUB_USERNAME.Trim().ToLowerInvariant()
          $image = "docker.io/${username}/$($env:IMAGE_NAME):$env:GITHUB_SHA"

          & $trivyExe image `
            --image-src docker `
            --scanners vuln,secret `
            --severity HIGH,CRITICAL `
            --ignore-unfixed `
            --exit-code 1 `
            --no-progress `
            $image

          if ($LASTEXITCODE -ne 0) {
            throw "Image scan failed or found HIGH/CRITICAL vulnerabilities."
          }
        continue-on-error: true

      # 12. Push only when required checks succeed
      - name: Push image to Docker Hub
        id: docker-push
        if: >-
          always() &&
          steps.python.outcome == 'success' &&
          steps.validate.outcome == 'success' &&
          steps.install-trivy.outcome == 'success' &&
          steps.sonar.outcome == 'success' &&
          steps.dependencies.outcome == 'success' &&
          steps.trivy-fs.outcome == 'success' &&
          steps.helm-lint.outcome == 'success' &&
          steps.helm-template.outcome == 'success' &&
          steps.docker-build.outcome == 'success' &&
          steps.trivy-image.outcome == 'success'
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_USERNAME) -or
              [string]::IsNullOrWhiteSpace($env:DOCKERHUB_TOKEN)) {
            throw "Docker Hub credentials are missing."
          }

          $username = $env:DOCKERHUB_USERNAME.Trim().ToLowerInvariant()
          $image = "docker.io/${username}/$($env:IMAGE_NAME):$env:GITHUB_SHA"

          Write-Host "Logging in to Docker Hub as $username"

          $env:DOCKERHUB_TOKEN |
            docker login docker.io `
              --username $username `
              --password-stdin

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Hub login failed. Verify the username and Read & Write token."
          }

          docker push $image

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Hub push failed. Check the Docker CLI error above."
          }

          Write-Host "Successfully pushed: $image"
        continue-on-error: true

      # 13. Always attempt logout
      - name: Docker Hub logout
        if: always()
        shell: powershell
        run: |
          docker logout docker.io
          Write-Host "Docker logout step completed."

      # 14. Final status summary
      - name: Pipeline summary
        id: summary
        if: always()
        shell: powershell
        env:
          PYTHON: ${{ steps.python.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          TRIVY_INSTALL: ${{ steps.install-trivy.outcome }}
          SONAR: ${{ steps.sonar.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          TRIVY_FS: ${{ steps.trivy-fs.outcome }}
          HELM_LINT: ${{ steps.helm-lint.outcome }}
          HELM_TEMPLATE: ${{ steps.helm-template.outcome }}
          DOCKER_BUILD: ${{ steps.docker-build.outcome }}
          TRIVY_IMAGE: ${{ steps.trivy-image.outcome }}
          DOCKER_PUSH: ${{ steps.docker-push.outcome }}
        run: |
          $ErrorActionPreference = "Continue"

          $results = [ordered]@{
            "Python check" = $env:PYTHON
            "Tools and secrets validation" = $env:VALIDATE
            "Trivy installation" = $env:TRIVY_INSTALL
            "SonarQube analysis" = $env:SONAR
            "Python dependencies" = $env:DEPENDENCIES
            "Trivy filesystem scan" = $env:TRIVY_FS
            "Helm chart lint" = $env:HELM_LINT
            "Helm template validation" = $env:HELM_TEMPLATE
            "Docker build" = $env:DOCKER_BUILD
            "Trivy image scan" = $env:TRIVY_IMAGE
            "Docker Hub push" = $env:DOCKER_PUSH
          }

          Write-Host ""
          Write-Host "========== EFK PIPELINE SUMMARY =========="

          $failures = @()

          foreach ($entry in $results.GetEnumerator()) {
            $status = $entry.Value

            if ([string]::IsNullOrWhiteSpace($status)) {
              $status = "skipped"
            }

            Write-Host ("{0}: {1}" -f $entry.Key, $status)

            if ($status -in @("failure", "cancelled")) {
              $failures += $entry.Key
            }
          }

          Write-Host "=========================================="

          if ($failures.Count -gt 0) {
            Write-Host "::error::Failed stages: $($failures -join ', ')"
            exit 1
          }

          Write-Host "All executed stages succeeded."
