name: CI-CD - SonarQube, Trivy and Helm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/efk-demo-app
  CHART_PATH: charts/sample-app

jobs:
  validate-and-scan:
    name: Code Quality and Security
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required tools
        shell: powershell
        run: |
          python --version
          docker --version
          helm version
          git --version

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install pytest

      - name: Run tests if present
        shell: powershell
        run: |
          if (Test-Path tests) {
            python -m pytest tests
            if ($LASTEXITCODE -ne 0) {
              throw "Python tests failed."
            }
          } else {
            Write-Host "No root tests directory found; skipping tests."
          }

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.34.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Helm lint
        shell: powershell
        run: |
          helm lint $env:CHART_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "Helm lint failed."
          }

      - name: Build Docker image
        shell: powershell
        run: |
          docker build -f app/Dockerfile -t "${env:IMAGE_NAME}:${env:GITHUB_SHA}" app
          if ($LASTEXITCODE -ne 0) {
            throw "Docker image build failed."
          }

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.34.0
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/efk-demo-app:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push scanned image
        if: github.event_name != 'pull_request'
        shell: powershell
        run: |
          docker push "${env:IMAGE_NAME}:${env:GITHUB_SHA}"
          if ($LASTEXITCODE -ne 0) {
            throw "Docker image push failed."
          }

  deploy:
    name: Deploy application with Helm
    needs: validate-and-scan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kubernetes context
        shell: powershell
        run: |
          kubectl config current-context
          kubectl get nodes
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot access the Kubernetes cluster."
          }

      - name: Deploy application
        shell: powershell
        run: |
          helm upgrade --install sample-app $env:CHART_PATH `
            --namespace default `
            --set image.repository=$env:IMAGE_NAME `
            --set-string image.tag=$env:GITHUB_SHA `
            --wait `
            --timeout 5m

          if ($LASTEXITCODE -ne 0) {
            throw "Helm deployment failed."
          }

      - name: Verify deployment
        shell: powershell
        run: |
          kubectl rollout status deployment/sample-app `
            --namespace default `
            --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "Sample application rollout failed."
          }

          kubectl get pods -n default
          kubectl get service sample-app -n default
