
name: EFK Logging Project CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: efk-logging-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART_PATH: charts/sample-app
  APP_IMAGE_NAME: efk-demo-app

jobs:
  validate-and-scan:
    name: Validate, Scan and Build
    runs-on: self-hosted

    steps:
      # 1. Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Verify required tools
      - name: Check required tools
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $pythonExe = "C:\Users\RamisettyLeelanaveen\AppData\Local\Python\pythoncore-3.15-64\python.exe"

          if (-not (Test-Path $pythonExe)) {
            throw "Python executable not found: $pythonExe"
          }

          & $pythonExe --version
          if ($LASTEXITCODE -ne 0) {
            throw "Python verification failed."
          }

          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "PYTHON_EXE=$pythonExe" + [Environment]::NewLine,
            $utf8NoBom
          )

          foreach ($commandName in @("git", "docker", "helm", "kubectl")) {
            if (-not (Get-Command $commandName -ErrorAction SilentlyContinue)) {
              throw "Required command not found: $commandName"
            }
          }

          docker --version
          if ($LASTEXITCODE -ne 0) {
            throw "Docker is unavailable."
          }

          helm version --short
          if ($LASTEXITCODE -ne 0) {
            throw "Helm is unavailable."
          }

          kubectl version --client
          if ($LASTEXITCODE -ne 0) {
            throw "kubectl is unavailable."
          }

      # 3. Validate GitHub secrets
      - name: Validate required secrets
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($secretName in @(
            "DOCKERHUB_USERNAME",
            "DOCKERHUB_TOKEN",
            "SONAR_HOST_URL",
            "SONAR_TOKEN"
          )) {
            $value = [Environment]::GetEnvironmentVariable($secretName)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Missing GitHub Actions secret: $secretName"
            }
          }

          $username = $env:DOCKERHUB_USERNAME.Trim().ToLowerInvariant()

          if ($username -cnotmatch '^[a-z0-9]+(?:[._-][a-z0-9]+)*$') {
            throw "Invalid Docker Hub username. Set DOCKERHUB_USERNAME to your Docker Hub username only."
          }

          try {
            $sonarUri = [System.Uri]$env:SONAR_HOST_URL.Trim()
          }
          catch {
            throw "SONAR_HOST_URL is not a valid URL."
          }

          if (
            -not $sonarUri.IsAbsoluteUri -or
            $sonarUri.Scheme -notin @("http", "https")
          ) {
            throw "SONAR_HOST_URL must be an absolute HTTP or HTTPS URL."
          }

          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "DOCKERHUB_USERNAME_NORMALIZED=$username" + [Environment]::NewLine,
            $utf8NoBom
          )

          Write-Host "Required secrets and Docker Hub username format validated."

      # 4. Install Python dependencies using pip cache
      - name: Install Python dependencies
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $pipCache = Join-Path $env:USERPROFILE ".cache\pip"
          New-Item -ItemType Directory -Path $pipCache -Force | Out-Null

          & $env:PYTHON_EXE -m pip install --disable-pip-version-check --cache-dir $pipCache -r app/requirements.txt pytest

          if ($LASTEXITCODE -ne 0) {
            throw "Dependency installation failed."
          }

      # 5. Run Python tests
      - name: Run Python tests
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "tests") {
            & $env:PYTHON_EXE -m pytest tests -v

            if ($LASTEXITCODE -ne 0) {
              throw "Python tests failed."
            }
          }
          else {
            Write-Host "No root tests directory found; skipping pytest."
          }

      # 6. Install or reuse SonarScanner CLI
      - name: Install SonarScanner CLI
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $version = "7.2.0.5079"
          $toolsRoot = Join-Path $env:USERPROFILE ".tools"
          $extractPath = Join-Path $toolsRoot "sonar-scanner-cli-$version"

          $scannerFolder = Get-ChildItem $extractPath -Directory -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $scanner = if ($scannerFolder) {
            Join-Path $scannerFolder.FullName "bin\sonar-scanner.bat"
          } else {
            $null
          }

          if (-not $scanner -or -not (Test-Path $scanner)) {
            New-Item -ItemType Directory -Path $toolsRoot -Force | Out-Null

            $zipPath = Join-Path $env:RUNNER_TEMP "sonar-scanner-cli-$version.zip"
            $url = "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$version-windows-x64.zip"

            Invoke-WebRequest -Uri $url -OutFile $zipPath

            if (-not (Test-Path $zipPath) -or (Get-Item $zipPath).Length -lt 1MB) {
              throw "SonarScanner archive is missing or invalid."
            }

            if (Test-Path $extractPath) {
              Remove-Item $extractPath -Recurse -Force
            }

            New-Item -ItemType Directory -Path $extractPath -Force | Out-Null
            Expand-Archive -LiteralPath $zipPath -DestinationPath $extractPath -Force

            $scannerFolder = Get-ChildItem $extractPath -Directory |
              Select-Object -First 1

            if (-not $scannerFolder) {
              throw "SonarScanner folder not found."
            }

            $scanner = Join-Path $scannerFolder.FullName "bin\sonar-scanner.bat"
          }

          if (-not (Test-Path $scanner)) {
            throw "SonarScanner executable not found."
          }

          $scannerHome = Split-Path (Split-Path $scanner -Parent) -Parent
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)

          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "SONAR_SCANNER_HOME=$scannerHome" + [Environment]::NewLine,
            $utf8NoBom
          )

          Write-Host "SonarScanner $version is ready."

      # 7. SonarQube analysis
      - name: SonarQube analysis
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $scanner = Join-Path $env:SONAR_SCANNER_HOME "bin\sonar-scanner.bat"

          & $scanner `
            "-Dsonar.projectKey=efk-logging-project" `
            "-Dsonar.projectName=EFK Logging Project" `
            "-Dsonar.sources=app" `
            "-Dsonar.host.url=$($env:SONAR_HOST_URL.Trim())" `
            "-Dsonar.token=$env:SONAR_TOKEN" `
            "-Dsonar.qualitygate.wait=true"

          if ($LASTEXITCODE -ne 0) {
            throw "SonarQube analysis or quality gate failed."
          }

      # 8. Install or reuse Trivy
      - name: Install Trivy
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/aquasecurity/trivy/releases/latest" `
            -Headers @{ "User-Agent" = "efk-logging-ci" }

          $asset = $release.assets |
            Where-Object { $_.name -match '_Windows-64bit\.zip$' } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Trivy Windows archive not found in the latest release."
          }

          $version = [string]$release.tag_name
          $toolsRoot = Join-Path $env:USERPROFILE ".tools"
          $extractPath = Join-Path $toolsRoot "trivy-$version"
          $trivyExe = Join-Path $extractPath "trivy.exe"

          New-Item -ItemType Directory -Path $toolsRoot -Force | Out-Null

          if (-not (Test-Path $trivyExe)) {
            $zipPath = Join-Path $env:RUNNER_TEMP "trivy-windows-$version.zip"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath

            if (Test-Path $extractPath) {
              Remove-Item $extractPath -Recurse -Force
            }

            New-Item -ItemType Directory -Path $extractPath -Force | Out-Null
            Expand-Archive -LiteralPath $zipPath -DestinationPath $extractPath -Force
          }

          if (-not (Test-Path $trivyExe)) {
            throw "trivy.exe was not found after extraction."
          }

          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)

          [System.IO.File]::AppendAllText(
            $env:GITHUB_PATH,
            $extractPath + [Environment]::NewLine,
            $utf8NoBom
          )

          & $trivyExe --version

          if ($LASTEXITCODE -ne 0) {
            throw "Trivy verification failed."
          }

      # 9. Scan repository
      - name: Trivy filesystem security scan
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $trivyCache = Join-Path $env:USERPROFILE ".cache\trivy"
          New-Item -ItemType Directory -Path $trivyCache -Force | Out-Null

          trivy --cache-dir $trivyCache fs `
            --scanners vuln,misconfig,secret `
            --severity HIGH,CRITICAL `
            --ignore-unfixed `
            --exit-code 1 `
            .

          if ($LASTEXITCODE -ne 0) {
            throw "Trivy filesystem scan failed or found HIGH/CRITICAL issues."
          }

      # 10. Validate Helm chart
      - name: Helm lint and template validation
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          helm lint $env:CHART_PATH --strict

          if ($LASTEXITCODE -ne 0) {
            throw "Helm lint failed."
          }

          helm template sample-app $env:CHART_PATH --namespace default | Out-Null

          if ($LASTEXITCODE -ne 0) {
            throw "Helm template rendering failed."
          }

      # 11. Build Docker image
      - name: Build Docker image
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"

          $username = $env:DOCKERHUB_USERNAME_NORMALIZED
          $repository = $env:APP_IMAGE_NAME
          $tag = $env:IMAGE_TAG

          if ([string]::IsNullOrWhiteSpace($username)) {
            throw "Normalized Docker Hub username is missing."
          }

          if ($username -cnotmatch '^[a-z0-9]+(?:[._-][a-z0-9]+)*$') {
            throw "Invalid normalized Docker Hub username."
          }

          if ($repository -cnotmatch '^[a-z0-9]+(?:[._-][a-z0-9]+)*$') {
            throw "Invalid Docker repository name."
          }

          if ($tag -notmatch '^[a-f0-9]{40}$') {
            throw "IMAGE_TAG must be a full 40-character Git commit SHA."
          }

          $image = "${username}/${repository}:${tag}"

          Write-Host "Building Docker image."
          Write-Host "Repository: $repository"
          Write-Host "Tag: $tag"

          # Reuse local Docker layers on the self-hosted runner.
          # Refresh base images separately during maintenance.
          docker build -f app/Dockerfile -t $image app

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image build failed."
          }

          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)

          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "BUILT_IMAGE=$image" + [Environment]::NewLine,
            $utf8NoBom
          )

      # 12. Scan Docker image
      - name: Trivy Docker image security scan
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:BUILT_IMAGE)) {
            throw "BUILT_IMAGE is empty. Check the Docker build step."
          }

          $trivyCache = Join-Path $env:USERPROFILE ".cache\trivy"
          New-Item -ItemType Directory -Path $trivyCache -Force | Out-Null

          trivy --cache-dir $trivyCache image `
            --scanners vuln,misconfig,secret `
            --severity HIGH,CRITICAL `
            --ignore-unfixed `
            --exit-code 1 `
            $env:BUILT_IMAGE

          if ($LASTEXITCODE -ne 0) {
            throw "Trivy image scan failed or found HIGH/CRITICAL issues."
          }

      # 13. Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 14. Push Docker image
      - name: Push Docker image
        if: github.event_name != 'pull_request'
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:BUILT_IMAGE)) {
            throw "BUILT_IMAGE is missing."
          }

          docker push $env:BUILT_IMAGE

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image push failed."
          }

      # 15. Logout from Docker Hub
      - name: Logout from Docker Hub
        if: always() && github.event_name != 'pull_request'
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          docker logout
          exit 0
