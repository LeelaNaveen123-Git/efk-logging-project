
name: CI-CD - SonarQube, Trivy and Helm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/efk-demo-app
  CHART_PATH: charts/sample-app

jobs:
  validate-and-scan:
    name: Code Quality and Security
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Python
        run: python --version
        shell: pwsh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest
        shell: pwsh

      - name: Run tests if present
        run: |
          if (Test-Path tests) {
            python -m pytest tests
          } else {
            Write-Host "No root tests directory found; skipping tests."
          }
        shell: pwsh

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Helm lint
        run: helm lint $env:CHART_PATH
        shell: pwsh

      - name: Build Docker image
        run: |
          docker build -f app/Dockerfile -t "${env:IMAGE_NAME}:${env:GITHUB_SHA}" app
        shell: pwsh

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/efk-demo-app:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push scanned image
        if: github.event_name != 'pull_request'
        run: |
          docker push "${env:IMAGE_NAME}:${env:GITHUB_SHA}"
        shell: pwsh

  deploy:
    name: Deploy application with Helm
    needs: validate-and-scan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        run: |
          helm upgrade --install sample-app $env:CHART_PATH `
            --namespace default `
            --set image.repository=$env:IMAGE_NAME `
            --set-string image.tag=$env:GITHUB_SHA `
            --wait `
            --timeout 5m
        shell: pwsh

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/sample-app `
            --namespace default `
            --timeout=180s
          kubectl get pods -n default
        shell: pwsh
