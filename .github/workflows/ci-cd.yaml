
name: EFK Logging Project CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: efk-logging-project-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: docker.io/leelanaveen123/efk-demo-app
  IMAGE_TAG: ${{ github.sha }}
  CHART_PATH: charts/sample-app

jobs:
  validate-and-scan:
    name: Code Quality and Security
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python application
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          python --version
          if ($LASTEXITCODE -ne 0) {
            throw "Python is not available."
          }

          python -m compileall -q app
          if ($LASTEXITCODE -ne 0) {
            throw "Python compilation failed."
          }

          Write-Host "Python validation completed."

      - name: Check required tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($tool in @("docker", "helm", "kubectl")) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "$tool is not installed or is not available in PATH."
            }
          }

          docker version
          if ($LASTEXITCODE -ne 0) {
            throw "Docker is unavailable."
          }

          helm version
          if ($LASTEXITCODE -ne 0) {
            throw "Helm is unavailable."
          }

      - name: SonarQube code quality scan
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=efk-logging-project
            -Dsonar.sources=app
            -Dsonar.python.version=3.12
            -Dsonar.qualitygate.wait=true

      - name: Install Trivy if required
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $existing = Get-Command trivy -ErrorAction SilentlyContinue

          if ($existing) {
            trivy --version
            if ($LASTEXITCODE -ne 0) {
              throw "Existing Trivy installation is not working."
            }
          }
          else {
            $trivyDir = Join-Path $env:RUNNER_TEMP "trivy"
            $zipPath = Join-Path $env:RUNNER_TEMP "trivy-windows.zip"

            New-Item -ItemType Directory -Path $trivyDir -Force | Out-Null

            $release = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/aquasecurity/trivy/releases/latest" `
              -Headers @{ "User-Agent" = "GitHubActions" }

            $asset = $release.assets |
              Where-Object { $_.name -match "windows-64bit\.zip$" } |
              Select-Object -First 1

            if (-not $asset) {
              throw "Could not find the Windows Trivy release asset."
            }

            Invoke-WebRequest `
              -Uri $asset.browser_download_url `
              -OutFile $zipPath

            Expand-Archive -Path $zipPath -DestinationPath $trivyDir -Force

            $exe = Get-ChildItem -Path $trivyDir -Filter "trivy.exe" -Recurse |
              Select-Object -First 1

            if (-not $exe) {
              throw "Trivy executable was not found after extraction."
            }

            Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName

            $env:PATH = "$($exe.DirectoryName);$env:PATH"

            & $exe.FullName --version
            if ($LASTEXITCODE -ne 0) {
              throw "Trivy installation failed."
            }
          }

      - name: Trivy filesystem security scan
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          trivy fs `
            --scanners vuln,misconfig,secret `
            --severity HIGH,CRITICAL `
            --exit-code 1 `
            --skip-dirs .git `
            .

          if ($LASTEXITCODE -ne 0) {
            throw "Trivy filesystem scan failed or found blocking vulnerabilities."
          }

      - name: Helm chart lint
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          helm lint $env:CHART_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "Helm chart lint failed."
          }

      - name: Helm template validation
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          helm template sample-app $env:CHART_PATH `
            --set-string "image.repository=$env:IMAGE_REPOSITORY" `
            --set-string "image.tag=$env:IMAGE_TAG"

          if ($LASTEXITCODE -ne 0) {
            throw "Helm template validation failed."
          }

      - name: Reset previous Docker Hub login
        shell: powershell
        run: |
          # Clear potentially stale credentials from the self-hosted runner.
          docker logout 2>$null
          Write-Host "Checked previous Docker Hub credentials."

      - name: Login to Docker Hub
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_USERNAME)) {
            throw "DOCKERHUB_USERNAME secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_TOKEN)) {
            throw "DOCKERHUB_TOKEN secret is missing."
          }

          $env:DOCKERHUB_TOKEN |
            docker login --username $env:DOCKERHUB_USERNAME --password-stdin

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Hub login failed. Verify the username and access token."
          }

      - name: Verify Docker Hub base image access
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          docker pull python:3.12-slim
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot pull python:3.12-slim. Check Docker Hub authentication and connectivity."
          }

      - name: Build application image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $image = "$($env:IMAGE_REPOSITORY):$($env:IMAGE_TAG)"
          Write-Host "Building image: $image"

          docker build --pull `
            -f app/Dockerfile `
            -t $image `
            app

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image build failed."
          }

      - name: Trivy container image scan
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $image = "$($env:IMAGE_REPOSITORY):$($env:IMAGE_TAG)"

          trivy image `
            --scanners vuln,secret `
            --severity HIGH,CRITICAL `
            --exit-code 1 `
            $image

          if ($LASTEXITCODE -ne 0) {
            throw "Trivy image scan failed or found blocking vulnerabilities."
          }

      - name: Push image to Docker Hub
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $image = "$($env:IMAGE_REPOSITORY):$($env:IMAGE_TAG)"

          docker push $image
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Hub push failed. Check repository permissions and authentication."
          }

          Write-Host "Successfully pushed $image"

  deploy:
    name: Deploy application with Helm
    runs-on: [self-hosted, Windows, X64]
    needs: validate-and-scan
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify Kubernetes connectivity
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          kubectl config current-context
          if ($LASTEXITCODE -ne 0) {
            throw "No valid Kubernetes context is configured."
          }

          kubectl cluster-info
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot connect to the Kubernetes cluster."
          }

      - name: Deploy application using Helm
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          helm upgrade --install sample-app $env:CHART_PATH `
            --namespace default `
            --create-namespace `
            --set-string "image.repository=$env:IMAGE_REPOSITORY" `
            --set-string "image.tag=$env:IMAGE_TAG" `
            --wait `
            --timeout 5m

          if ($LASTEXITCODE -ne 0) {
            throw "Helm deployment failed."
          }

      - name: Verify application rollout
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          kubectl rollout status deployment/sample-app `
            --namespace default `
            --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            kubectl get pods -n default -o wide
            kubectl get events -n default --sort-by=.metadata.creationTimestamp
            throw "Application rollout failed. Check pod events and deployment logs."
          }

          kubectl get deployment sample-app -n default
          kubectl get pods -n default
