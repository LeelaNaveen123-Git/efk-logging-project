
name: CI-CD - SonarQube, Trivy and Helm

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CHART_PATH: charts/sample-app
  K8S_NAMESPACE: default

jobs:
  validate-and-scan:
    name: Code Quality and Security
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required tools
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $pythonExe = "C:\Users\RamisettyLeelanaveen\AppData\Local\Python\pythoncore-3.15-64\python.exe"

          if (-not (Test-Path $pythonExe)) {
            throw "Python not found at $pythonExe. Verify the Python installation path for the runner account."
          }

          & $pythonExe --version
          if ($LASTEXITCODE -ne 0) { throw "Python is unavailable." }

          docker --version
          if ($LASTEXITCODE -ne 0) { throw "Docker is unavailable." }

          helm version
          if ($LASTEXITCODE -ne 0) { throw "Helm is unavailable." }

          kubectl version --client
          if ($LASTEXITCODE -ne 0) { throw "kubectl is unavailable." }

          git --version
          if ($LASTEXITCODE -ne 0) { throw "Git is unavailable." }

          "PYTHON_EXE=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate required secrets
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($name in @(
            "DOCKERHUB_USERNAME",
            "DOCKERHUB_TOKEN",
            "SONAR_HOST_URL",
            "SONAR_TOKEN"
          )) {
            if ([string]::IsNullOrWhiteSpace(
              [Environment]::GetEnvironmentVariable($name)
            )) {
              throw "Missing required GitHub Actions secret: $name"
            }
          }

      - name: Install Python dependencies
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          & $env:PYTHON_EXE -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upgrade pip."
          }

          & $env:PYTHON_EXE -m pip install -r app/requirements.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install application dependencies."
          }

          & $env:PYTHON_EXE -m pip install pytest
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install pytest."
          }

      - name: Run tests if present
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "tests") {
            & $env:PYTHON_EXE -m pytest tests
            if ($LASTEXITCODE -ne 0) {
              throw "Python tests failed."
            }
          } else {
            Write-Host "No root tests directory found; skipping tests."
          }

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.34.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Helm lint
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          helm lint $env:CHART_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "Helm lint failed."
          }

      - name: Build Docker image
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $image = "efk-demo-app:pr-$($env:GITHUB_SHA)"
          } else {
            $image = "$($env:DOCKERHUB_USERNAME)/efk-demo-app:$($env:GITHUB_SHA)"
          }

          Write-Host "Building image: $image"

          docker build -f app/Dockerfile -t $image app
          if ($LASTEXITCODE -ne 0) {
            throw "Docker image build failed."
          }

          "BUILT_IMAGE=$image" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.34.0
        with:
          scan-type: image
          image-ref: ${{ env.BUILT_IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push scanned image
        if: github.event_name != 'pull_request'
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          docker push $env:BUILT_IMAGE
          if ($LASTEXITCODE -ne 0) {
            throw "Docker image push failed."
          }

  deploy:
    name: Deploy application with Helm
    needs: validate-and-scan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kubernetes context
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $context = kubectl config current-context
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot read the Kubernetes context."
          }

          Write-Host "Kubernetes context: $context"

          if ($context -ne "docker-desktop") {
            throw "Expected Docker Desktop context, but found: $context"
          }

          kubectl get nodes
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot access the Kubernetes cluster."
          }

      - name: Deploy application with Helm
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $ErrorActionPreference = "Stop"

          $image = "$($env:DOCKERHUB_USERNAME)/efk-demo-app"

          helm upgrade --install sample-app $env:CHART_PATH `
            --namespace $env:K8S_NAMESPACE `
            --set-string image.repository="$image" `
            --set-string image.tag="$env:GITHUB_SHA" `
            --wait `
            --timeout 5m

          if ($LASTEXITCODE -ne 0) {
            throw "Helm deployment failed."
          }

      - name: Verify deployment
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          kubectl rollout status deployment/sample-app `
            --namespace $env:K8S_NAMESPACE `
            --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "Sample application rollout failed."
          }

          kubectl get deployment sample-app -n $env:K8S_NAMESPACE
          kubectl get pods -n $env:K8S_NAMESPACE
          kubectl get service sample-app -n $env:K8S_NAMESPACE
