
name: EFK Logging Project CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: efk-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-cd:
    name: EFK CI/CD Pipeline
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60

    env:
      IMAGE_NAME: efk-demo-app
      CHART_PATH: charts/sample-app

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Python and dependency cache
      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
        continue-on-error: true

      # 3. Validate runner and GitHub secrets
      - name: Validate tools and secrets
        id: validate
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($tool in @("git", "docker", "helm")) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Required tool not found: $tool"
            }
            Write-Host "$tool is installed."
          }

          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_USERNAME)) {
            throw "Missing secret DOCKERHUB_USERNAME."
          }

          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_TOKEN)) {
            throw "Missing secret DOCKERHUB_TOKEN."
          }

          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw "Missing secret SONAR_TOKEN."
          }

          docker version
          if ($LASTEXITCODE -ne 0) {
            throw "Docker daemon is not available."
          }

      # 4. Install Trivy using the official latest release redirect
      - name: Install Trivy
        id: install-trivy
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $toolDirectory = Join-Path $env:USERPROFILE ".tools\trivy"
          $trivyExe = Join-Path $toolDirectory "trivy.exe"

          New-Item -ItemType Directory -Path $toolDirectory -Force |
            Out-Null

          # Reuse a working Trivy binary from previous runs.
          if (Test-Path $trivyExe) {
            $versionOutput = (& $trivyExe --version 2>&1 | Out-String)

            if ($LASTEXITCODE -eq 0 -and $versionOutput -match "Version:") {
              Write-Host "Using cached Trivy installation."
              Write-Host $versionOutput
              exit 0
            }

            Remove-Item $trivyExe -Force -ErrorAction SilentlyContinue
          }

          # Resolve the actual published release instead of guessing a tag.
          $releasePage = "https://github.com/aquasecurity/trivy/releases/latest"

          Write-Host "Resolving latest Trivy release..."

          $response = Invoke-WebRequest `
            -Uri $releasePage `
            -MaximumRedirection 10 `
            -UseBasicParsing

          $finalUrl = $response.BaseResponse.ResponseUri.AbsoluteUri

          if ($finalUrl -notmatch '/releases/tag/(v[0-9.]+)$') {
            throw "Unable to determine the Trivy version from release URL: $finalUrl"
          }

          $version = $Matches[1].TrimStart("v")
          $assetName = "trivy_${version}_windows-64bit.zip"
          $downloadUrl = "https://github.com/aquasecurity/trivy/releases/download/v$version/$assetName"

          $zipPath = Join-Path $env:TEMP $assetName
          $extractPath = Join-Path $env:TEMP "trivy-extract"

          Write-Host "Downloading Trivy $version..."

          Invoke-WebRequest `
            -Uri $downloadUrl `
            -OutFile $zipPath `
            -UseBasicParsing

          if (Test-Path $extractPath) {
            Remove-Item $extractPath -Recurse -Force
          }

          New-Item -ItemType Directory -Path $extractPath -Force |
            Out-Null

          Expand-Archive `
            -Path $zipPath `
            -DestinationPath $extractPath `
            -Force

          $downloadedExe = Get-ChildItem `
            -Path $extractPath `
            -Filter "trivy.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $downloadedExe) {
            throw "The downloaded archive does not contain trivy.exe."
          }

          Copy-Item $downloadedExe.FullName $trivyExe -Force

          Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
          Remove-Item $extractPath -Recurse -Force -ErrorAction SilentlyContinue

          & $trivyExe --version

          if ($LASTEXITCODE -ne 0) {
            throw "Trivy installation verification failed."
          }

      # 5. SonarQube analysis
      - name: SonarQube code analysis
        id: sonar
        if: always()
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'http://localhost:9000' }}
        with:
          args: >
            -Dsonar.projectKey=efk-logging-project
            -Dsonar.sources=app
            -Dsonar.python.version=3.12
        continue-on-error: true

      # 6. Install application dependencies
      - name: Install Python dependencies
        id: dependencies
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            throw "Python is not available on the runner."
          }

          if (Test-Path "app/requirements.txt") {
            python -m pip install --upgrade pip
            if ($LASTEXITCODE -ne 0) {
              throw "pip upgrade failed."
            }

            python -m pip install -r app/requirements.txt
            if ($LASTEXITCODE -ne 0) {
              throw "Python dependency installation failed."
            }
          } else {
            Write-Host "No requirements file found; skipping dependency installation."
          }
        continue-on-error: true

      # 7. Trivy filesystem scan
      - name: Trivy filesystem scan
        id: trivy-fs
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $trivyExe = Join-Path $env:USERPROFILE ".tools\trivy\trivy.exe"

          if (-not (Test-Path $trivyExe)) {
            throw "Trivy is not installed."
          }

          & $trivyExe fs `
            --scanners vuln,secret,misconfig `
            --severity HIGH,CRITICAL `
            --ignore-unfixed `
            --exit-code 1 `
            --no-progress `
            .

          if ($LASTEXITCODE -ne 0) {
            throw "Trivy filesystem scan reported findings or failed."
          }
        continue-on-error: true

      # 8. Helm chart lint
      - name: Helm lint
        id: helm-lint
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "$env:CHART_PATH/Chart.yaml")) {
            throw "Chart not found at $env:CHART_PATH"
          }

          helm lint $env:CHART_PATH

          if ($LASTEXITCODE -ne 0) {
            throw "Helm lint failed."
          }
        continue-on-error: true

      # 9. Helm template validation
      - name: Helm template validation
        id: helm-template
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          helm template sample-app $env:CHART_PATH `
            --namespace default `
            --debug

          if ($LASTEXITCODE -ne 0) {
            throw "Helm template validation failed."
          }
        continue-on-error: true

      # 10. Build Docker image
      - name: Build Docker image
        id: docker-build
        if: always()
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_USERNAME)) {
            throw "DOCKERHUB_USERNAME is missing."
          }

          if (-not (Test-Path "app/Dockerfile")) {
            throw "Dockerfile not found at app/Dockerfile."
          }

          $username = $env:DOCKERHUB_USERNAME.Trim().ToLowerInvariant()
          $image = "${username}/$env:IMAGE_NAME`:$env:GITHUB_SHA"

          Write-Host "Building $image"

          docker build `
            --file app/Dockerfile `
            --tag $image `
            app

          if ($LASTEXITCODE -ne 0) {
            throw "Docker build failed."
          }

      # 11. Push Docker image
      - name: Push image to Docker Hub
        id: docker-push
        if: always()
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_USERNAME) -or
              [string]::IsNullOrWhiteSpace($env:DOCKERHUB_TOKEN)) {
            throw "Docker Hub credentials are missing."
          }

          $username = $env:DOCKERHUB_USERNAME.Trim().ToLowerInvariant()
          $image = "${username}/$env:IMAGE_NAME`:$env:GITHUB_SHA"

          $env:DOCKERHUB_TOKEN |
            docker login --username $username --password-stdin

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Hub login failed. Check the token's write permissions."
          }

          docker push $image

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image push failed."
          }

          Write-Host "Image pushed successfully: $image"
        continue-on-error: true

      # 12. Trivy Docker image scan
      - name: Trivy image scan
        id: trivy-image
        if: always()
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $ErrorActionPreference = "Stop"

          $trivyExe = Join-Path $env:USERPROFILE ".tools\trivy\trivy.exe"

          if (-not (Test-Path $trivyExe)) {
            throw "Trivy is not installed."
          }

          $username = $env:DOCKERHUB_USERNAME.Trim().ToLowerInvariant()
          $image = "${username}/$env:IMAGE_NAME`:$env:GITHUB_SHA"

          & $trivyExe image `
            --scanners vuln,secret `
            --severity HIGH,CRITICAL `
            --ignore-unfixed `
            --exit-code 1 `
            --no-progress `
            $image

          if ($LASTEXITCODE -ne 0) {
            throw "Trivy image scan reported findings or failed."
          }
        continue-on-error: true

      # 13. Docker logout
      - name: Docker Hub logout
        if: always()
        shell: powershell
        run: |
          docker logout
          Write-Host "Docker logout completed."

      # 14. Final pipeline status
      - name: Pipeline summary
        id: summary
        if: always()
        shell: powershell
        env:
          VALIDATE: ${{ steps.validate.outcome }}
          TRIVY_INSTALL: ${{ steps.install-trivy.outcome }}
          SONAR: ${{ steps.sonar.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          TRIVY_FS: ${{ steps.trivy-fs.outcome }}
          HELM_LINT: ${{ steps.helm-lint.outcome }}
          HELM_TEMPLATE: ${{ steps.helm-template.outcome }}
          DOCKER_BUILD: ${{ steps.docker-build.outcome }}
          DOCKER_PUSH: ${{ steps.docker-push.outcome }}
          TRIVY_IMAGE: ${{ steps.trivy-image.outcome }}
        run: |
          $ErrorActionPreference = "Continue"

          $results = [ordered]@{
            "Tools and secrets validation" = $env:VALIDATE
            "Trivy installation"            = $env:TRIVY_INSTALL
            "SonarQube analysis"            = $env:SONAR
            "Python dependencies"           = $env:DEPENDENCIES
            "Trivy filesystem scan"         = $env:TRIVY_FS
            "Helm lint"                     = $env:HELM_LINT
            "Helm template validation"      = $env:HELM_TEMPLATE
            "Docker build"                  = $env:DOCKER_BUILD
            "Docker Hub push"               = $env:DOCKER_PUSH
            "Trivy image scan"              = $env:TRIVY_IMAGE
          }

          Write-Host ""
          Write-Host "========== EFK PIPELINE SUMMARY =========="

          $failures = @()

          foreach ($entry in $results.GetEnumerator()) {
            Write-Host ("{0}: {1}" -f $entry.Key, $entry.Value)

            if ($entry.Value -ne "success") {
              $failures += $entry.Key
            }
          }

          Write-Host "=========================================="

          if ($failures.Count -gt 0) {
            Write-Host "::error::Failed stages: $($failures -join ', ')"
            exit 1
          }

          Write-Host "All pipeline stages succeeded."
