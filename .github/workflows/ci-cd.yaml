
name: EFK Logging Project CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: efk-logging-project-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: docker.io/leelanaveen123/efk-demo-app
  IMAGE_TAG: ${{ github.sha }}
  CHART_PATH: charts/sample-app

jobs:
  validate-and-scan:
    name: Validate, Scan, Build and Push
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify project files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $requiredFiles = @(
            "app/Dockerfile",
            "charts/sample-app/Chart.yaml",
            "sonar-project.properties"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required project file is missing: $file"
            }
          }

          Write-Host "Required project files are present."

      - name: Verify required tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($tool in @("docker", "helm")) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "$tool is missing from PATH."
            }
          }

          docker version
          if ($LASTEXITCODE -ne 0) {
            throw "Docker daemon is unavailable."
          }

          helm version
          if ($LASTEXITCODE -ne 0) {
            throw "Helm is unavailable."
          }

      # Code quality and security
      - name: SonarQube analysis and quality gate
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=efk-logging-project
            -Dsonar.sources=app
            -Dsonar.python.version=3.12
            -Dsonar.qualitygate.wait=true

      - name: Install or verify Trivy
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $trivyCommand = Get-Command trivy -ErrorAction SilentlyContinue

          if ($trivyCommand) {
            trivy --version
            if ($LASTEXITCODE -ne 0) {
              throw "Trivy is installed but failed to start."
            }
          }
          else {
            $installDir = Join-Path $env:RUNNER_TEMP "trivy"
            $zipPath = Join-Path $env:RUNNER_TEMP "trivy-windows.zip"

            New-Item -ItemType Directory -Path $installDir -Force |
              Out-Null

            $release = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/aquasecurity/trivy/releases/latest" `
              -Headers @{ "User-Agent" = "GitHubActions" }

            $asset = $release.assets |
              Where-Object { $_.name -match "Windows-64bit\.zip$" } |
              Select-Object -First 1

            if (-not $asset) {
              throw "Could not find the Windows Trivy ZIP release."
            }

            Invoke-WebRequest `
              -Uri $asset.browser_download_url `
              -OutFile $zipPath

            Expand-Archive `
              -Path $zipPath `
              -DestinationPath $installDir `
              -Force

            $trivyExe = Get-ChildItem `
              -Path $installDir `
              -Filter "trivy.exe" `
              -Recurse |
              Select-Object -First 1

            if (-not $trivyExe) {
              throw "Trivy executable was not found."
            }

            Add-Content -Path $env:GITHUB_PATH `
              -Value $trivyExe.DirectoryName

            $env:PATH = "$($trivyExe.DirectoryName);$env:PATH"

            & $trivyExe.FullName --version
            if ($LASTEXITCODE -ne 0) {
              throw "Trivy installation verification failed."
            }
          }

      - name: Trivy filesystem scan
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          trivy fs `
            --scanners vuln,misconfig,secret `
            --severity HIGH,CRITICAL `
            --exit-code 1 `
            --skip-dirs .git `
            .

          if ($LASTEXITCODE -ne 0) {
            throw "Filesystem scan failed or blocking security findings were detected."
          }

      # Helm validation
      - name: Helm lint
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          helm lint $env:CHART_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "Helm chart lint failed."
          }

      - name: Validate Helm templates
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          helm template sample-app $env:CHART_PATH `
            --set-string "image.repository=$env:IMAGE_REPOSITORY" `
            --set-string "image.tag=$env:IMAGE_TAG"

          if ($LASTEXITCODE -ne 0) {
            throw "Helm template rendering failed."
          }

      # Docker Hub authentication must happen before build
      - name: Clear previous Docker Hub login
        shell: powershell
        run: |
          docker logout 2>$null
          Write-Host "Previous Docker Hub login cleared where applicable."

      - name: Login to Docker Hub
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_USERNAME)) {
            throw "DOCKERHUB_USERNAME secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_TOKEN)) {
            throw "DOCKERHUB_TOKEN secret is missing."
          }

          $env:DOCKERHUB_TOKEN |
            docker login `
              --username $env:DOCKERHUB_USERNAME `
              --password-stdin

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Hub login failed. Verify the username and token."
          }

      - name: Verify Docker Hub base image pull
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          docker pull python:3.12-slim
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot pull python:3.12-slim. Check authentication and registry connectivity."
          }

      - name: Build application image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $image = "$($env:IMAGE_REPOSITORY):$($env:IMAGE_TAG)"
          Write-Host "Building image: $image"

          docker build --pull `
            -f app/Dockerfile `
            -t $image `
            .

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image build failed."
          }

      # Image security gate
      - name: Trivy image scan
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $image = "$($env:IMAGE_REPOSITORY):$($env:IMAGE_TAG)"

          trivy image `
            --scanners vuln,secret `
            --severity HIGH,CRITICAL `
            --exit-code 1 `
            $image

          if ($LASTEXITCODE -ne 0) {
            throw "Image scan failed or blocking security findings were detected."
          }

      - name: Push image to Docker Hub
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $image = "$($env:IMAGE_REPOSITORY):$($env:IMAGE_TAG)"

          docker push $image
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Hub push failed. Verify repository write permissions."
          }

          Write-Host "Successfully pushed image: $image"

  deploy:
    name: Deploy with Helm
    runs-on: [self-hosted, Windows, X64]
    needs: validate-and-scan
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify Kubernetes connectivity
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          kubectl config current-context
          if ($LASTEXITCODE -ne 0) {
            throw "No valid Kubernetes context is configured."
          }

          kubectl cluster-info
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot connect to the Kubernetes cluster."
          }

      - name: Deploy application with Helm
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          helm upgrade --install sample-app $env:CHART_PATH `
            --namespace default `
            --create-namespace `
            --set-string "image.repository=$env:IMAGE_REPOSITORY" `
            --set-string "image.tag=$env:IMAGE_TAG" `
            --wait `
            --timeout 5m

          if ($LASTEXITCODE -ne 0) {
            throw "Helm deployment failed."
          }

      - name: Verify deployment rollout
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          kubectl rollout status deployment/sample-app `
            --namespace default `
            --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            kubectl get pods -n default -o wide
            kubectl get events -n default `
              --sort-by=.metadata.creationTimestamp

            throw "Deployment rollout failed. Review pod status and events."
          }

          kubectl get deployment sample-app -n default
          kubectl get pods -n default
